<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选型助手 · 饭庐者说</title>
  <meta name="description" content="回答 4 个问题，30 秒找到最适合你的 AI Coding Plan。">
  <link rel="stylesheet" href="styles/shared.css">
  <style>
    .wizard-wrap { max-width: 680px; margin: 0 auto; padding: var(--space-8) 0; }
    .wizard-progress {
      display: flex; gap: var(--space-2); margin-bottom: var(--space-6);
    }
    .wizard-step-dot {
      flex: 1; height: 3px; background: var(--bg-card); border-radius: var(--radius-full); transition: background 0.3s;
    }
    .wizard-step-dot.active { background: var(--accent); }
    .wizard-step-dot.done { background: var(--accent); opacity: 0.5; }

    .wizard-q { animation: wFade 0.3s ease; }
    @keyframes wFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .wizard-q-label { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: var(--space-2); }
    .wizard-q-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: var(--space-1); }
    .wizard-q-hint { font-size: 13px; color: var(--text-tertiary); margin-bottom: var(--space-5); }

    .wizard-opts { display: grid; gap: var(--space-3); margin-bottom: var(--space-6); }
    .wizard-opt {
      display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4);
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
      cursor: pointer; transition: all 0.15s ease; text-align: left; width: 100%;
    }
    .wizard-opt:hover { background: var(--bg-card-hover); border-color: var(--accent); transform: translateX(3px); }
    .wizard-opt.selected { background: var(--accent-soft); border-color: var(--accent); }
    .wizard-opt-label { font-size: 11px; font-weight: 700; color: var(--text-muted); width: 36px; flex-shrink: 0; }
    .wizard-opt-body { flex: 1; }
    .wizard-opt-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .wizard-opt-desc { font-size: 12px; color: var(--text-tertiary); }

    .wizard-nav { display: flex; justify-content: space-between; gap: var(--space-3); }

    /* Result */
    .result-card {
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
      padding: var(--space-5); margin-bottom: var(--space-4); position: relative; overflow: hidden;
    }
    .result-card.best { border-color: var(--accent); background: linear-gradient(135deg, rgba(16,185,129,0.08), var(--bg-card)); }
    .result-rank {
      position: absolute; top: 0; right: 0; padding: var(--space-1) var(--space-3);
      font-size: 10px; font-weight: 700; background: var(--accent); color: #090d14;
      border-bottom-left-radius: var(--radius-md);
    }
    @media (max-width: 640px) {
      .wizard-wrap { padding: var(--space-4); }
      .wizard-q-title { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="navMount"></div>
  <main class="container">
    <div class="wizard-wrap">
      <div style="text-align:center;margin-bottom:var(--space-6);">
        <span class="section-eyebrow">WIZARD</span>
        <h1 class="hero-title" style="font-size:28px;margin:0 auto 8px;">30 秒找到你的<br><span class="hero-title-accent">最佳 Coding Plan</span></h1>
        <p style="font-size:14px;color:var(--text-tertiary);">回答 4 个问题，基于真实数据给你 Top 3 推荐。</p>
      </div>

      <div class="wizard-progress" id="progress"></div>
      <div id="wizardContainer"></div>
      <div id="resultContainer" style="display:none;"></div>
    </div>
  </main>
  <div id="footerMount"></div>

  <script src="scripts/shared.js"></script>
  <script>
    var QUESTIONS = [
      { key: 'budget', label: '问题 1/4', title: '你每月想花多少钱？', hint: '按真实预算选，别高估自己。',
        options: [
          { label: '50', value: {max:50}, title: '50 元以内', desc: '学生党 / 体验党' },
          { label: '200', value: {max:200}, title: '50-200 元', desc: '日常开发者主流预算' },
          { label: '500', value: {max:500}, title: '200-500 元', desc: '重度用户 / 多平台持有' },
          { label: 'MAX', value: {max:null}, title: '500 以上', desc: '团队 / 极客 / Agent 重度' }
        ]},
      { key: 'model', label: '问题 2/4', title: '你最在意哪个模型？', hint: '选你最常用的，或选「都要」让全家桶平台胜出。',
        options: [
          { label: 'GLM', value: 'GLM-5.2', title: 'GLM-5.2', desc: '智谱 T0 模型，Opus 平替' },
          { label: 'DS', value: 'DeepSeek-V4', title: 'DeepSeek V4', desc: '原生性价比之王' },
          { label: 'K3', value: 'Kimi', title: 'Kimi K3', desc: '长上下文 + 推理强' },
          { label: 'ALL', value: null, title: '都要 / 不限', desc: '让模型最全的平台胜出' }
        ]},
      { key: 'rush', label: '问题 3/4', title: '你能接受抢购吗？', hint: '抢购更便宜但要拼手速，不抢省心但选择少。',
        options: [
          { label: 'YES', value: true, title: '能抢，越划算越好', desc: '想要最高性价比，愿意蹲点' },
          { label: 'NO', value: false, title: '不抢，要稳', desc: '随时下单，不想折腾' },
          { label: 'ANY', value: null, title: '都行', desc: '看性价比决定' }
        ]},
      { key: 'scene', label: '问题 4/4', title: '你的主要使用场景？', hint: '决定我们推荐哪种类型的套餐。',
        options: [
          { label: 'DEV', value: 'coding', title: '日常写代码', desc: '高频使用 / Cursor / Claude Code' },
          { label: 'CHAT', value: 'general', title: '日常助手', desc: '问答 / 文档处理 / 通用任务' },
          { label: 'IMG', value: 'multimodal', title: '多模态需求', desc: '图像识别 / 视觉理解' },
          { label: 'BOT', value: 'agentic', title: 'Agent / 自动化', desc: 'Agent 任务 / 长任务运行' }
        ]}
    ];

    var answers = {};
    var currentStep = 0;

    function initWizard() {
      loadConfig().then(function() {
        return loadPlans();
      }).then(function() {
        mountNav('wizard');
        mountFooter();
        renderQuestion();
      });
    }

    function renderQuestion() {
      var q = QUESTIONS[currentStep];
      var container = document.getElementById('wizardContainer');
      var progress = document.getElementById('progress');

      progress.innerHTML = QUESTIONS.map(function(_, i) {
        var cls = i === currentStep ? 'active' : (i < currentStep ? 'done' : '');
        return '<div class="wizard-step-dot ' + cls + '"></div>';
      }).join('');

      container.innerHTML = '<div class="wizard-q">' +
        '<div class="wizard-q-label">' + escapeHtml(q.label) + '</div>' +
        '<h2 class="wizard-q-title">' + escapeHtml(q.title) + '</h2>' +
        '<p class="wizard-q-hint">' + escapeHtml(q.hint) + '</p>' +
        '<div class="wizard-opts">' + q.options.map(function(opt) {
          return '<button class="wizard-opt" data-value="' + opt.label + '">' +
            '<span class="wizard-opt-label">' + escapeHtml(opt.label) + '</span>' +
            '<div class="wizard-opt-body">' +
              '<div class="wizard-opt-title">' + escapeHtml(opt.title) + '</div>' +
              '<div class="wizard-opt-desc">' + escapeHtml(opt.desc) + '</div>' +
            '</div>' +
          '</button>';
        }).join('') + '</div>' +
        '<div class="wizard-nav">' +
          '<button class="btn btn-ghost" id="prevBtn"' + (currentStep === 0 ? ' style="visibility:hidden;"' : '') + '>上一题</button>' +
          '<span style="font-size:13px;color:var(--text-tertiary);align-self:center;">第 ' + (currentStep + 1) + '/' + QUESTIONS.length + ' 题</span>' +
        '</div>' +
      '</div>';

      var opts = container.querySelectorAll('.wizard-opt');
      opts.forEach(function(btn, i) {
        btn.addEventListener('click', function() {
          opts.forEach(function(b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          answers[q.key] = q.options[i].value;
          setTimeout(function() {
            if (currentStep < QUESTIONS.length - 1) {
              currentStep++;
              renderQuestion();
            } else {
              showResults();
            }
          }, 200);
        });
      });

      var prevBtn = document.getElementById('prevBtn');
      if (prevBtn) {
        prevBtn.addEventListener('click', function() {
          if (currentStep > 0) { currentStep--; renderQuestion(); }
        });
      }
    }

    function scorePlan(plan) {
      var score = plan.rating * 10;
      var reasons = [];

      var budget = answers.budget;
      var price = typeof plan.monthlyPrice === 'number' ? plan.monthlyPrice : 0;
      if (budget && budget.max !== null) {
        if (price <= budget.max) { score += 20; reasons.push('¥' + price + '/月 在你的预算内'); }
        else { score -= 30; }
      } else if (budget && budget.max === null) {
        if (price >= 200) score += 10;
      }

      var model = answers.model;
      if (model) {
        var hasModel = (plan.models || []).some(function(m) { return m.indexOf(model) !== -1; });
        if (hasModel) { score += 30; reasons.push('支持你想要的模型'); }
        else { score -= 15; }
      } else {
        var modelCount = (plan.models || []).length;
        if (modelCount >= 5) { score += 15; reasons.push('全家桶（' + modelCount + ' 个模型）'); }
      }

      var rush = answers.rush;
      var needRush = (plan.tags || []).indexOf('需抢购') !== -1;
      if (rush === false && needRush) { score -= 25; }
      else if (rush === false && !needRush) { score += 15; reasons.push('无需抢购'); }

      var scene = answers.scene;
      if (scene === 'coding' && plan.type === 'Coding Plan') { score += 10; reasons.push('Coding Plan 适合高频写代码'); }
      else if (scene === 'general' && plan.measuredMonthlyToken && plan.measuredMonthlyToken >= 500) { score += 8; reasons.push('月 Token 额度高'); }
      else if (scene === 'multimodal' && (plan.tags || []).indexOf('多模态') !== -1) { score += 20; reasons.push('支持多模态'); }
      else if (scene === 'agentic' && plan.measuredMonthlyToken && plan.measuredMonthlyToken >= 1000) { score += 15; reasons.push('Token 充足适合 Agent 长任务'); }

      return { score: score, reasons: reasons.slice(0, 3) };
    }

    function showResults() {
      document.getElementById('wizardContainer').style.display = 'none';
      document.getElementById('progress').style.display = 'none';

      var scored = CPS.plans.map(function(p) { var s = scorePlan(p); return { plan: p, score: s.score, reasons: s.reasons }; })
        .filter(function(item) { return item.score > 0; })
        .sort(function(a, b) { return b.score - a.score; })
        .slice(0, 3);

      var resultEl = document.getElementById('resultContainer');
      resultEl.style.display = 'block';

      if (!scored.length) {
        resultEl.innerHTML = '<div class="card" style="text-align:center;padding:48px;">' +
          '<h2 style="margin-bottom:8px;">没有完美匹配</h2>' +
          '<p style="color:var(--text-tertiary);margin-bottom:24px;">你的条件比较严格，建议放宽一两个选项重试。</p>' +
          '<button class="btn btn-primary" onclick="resetWizard()">重新选择</button></div>';
        return;
      }

      var rankLabels = ['最佳推荐', '备选方案', '第三选择'];
      resultEl.innerHTML = '<div style="text-align:center;margin-bottom:28px;">' +
        '<span class="section-eyebrow">RESULT</span>' +
        '<h2 style="font-size:24px;margin-top:12px;">基于你的回答，Top 3 推荐</h2>' +
        '<p style="color:var(--text-tertiary);margin-top:6px;">想看更多？切换到套餐对比页查看完整表格。</p>' +
      '</div>' +
      scored.map(function(item, i) {
        var p = item.plan;
        var reasonsHtml = item.reasons.map(function(r) { return '<li>' + escapeHtml(r) + '</li>'; }).join('');
        return '<div class="result-card' + (i === 0 ? ' best' : '') + '">' +
          '<div class="result-rank">' + rankLabels[i] + '</div>' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:16px;">' +
            '<div>' +
              '<h3 style="font-size:18px;font-weight:700;">' + escapeHtml(p.vendor) + ' <span style="font-size:14px;color:var(--text-tertiary);font-weight:400;">' + escapeHtml(p.plan) + '</span></h3>' +
              '<div style="font-size:13px;color:var(--text-tertiary);margin-top:2px;">' + escapeHtml(p.type) + ' ' + formatPrice(p.monthlyPrice, p.currency || '¥') + '/月</div>' +
            '</div>' +
            renderStars(p.rating) +
          '</div>' +
          (p.bloggerVerdict ? '<p style="font-size:13px;color:var(--accent);margin-bottom:12px;">"' + escapeHtml(p.bloggerVerdict) + '"</p>' : '') +
          (reasonsHtml ? '<ul class="reco-card-reasons" style="margin-bottom:16px;">' + reasonsHtml + '</ul>' : '') +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">' +
            (p.models || []).slice(0, 5).map(function(m) { return '<span class="tag">' + escapeHtml(m) + '</span>'; }).join('') +
          '</div>' +
          '<div style="display:flex;gap:12px;align-items:center;">' +
            '<a href="' + (p.action || '#') + '" class="btn btn-primary" target="_blank" rel="noopener">查看详情</a>' +
            '<span style="font-size:11px;color:var(--text-muted);">匹配度 ' + Math.round(item.score) + '%</span>' +
          '</div>' +
        '</div>';
      }).join('') +
      '<div style="display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap;">' +
        '<button class="btn btn-secondary" onclick="resetWizard()">重新选择</button>' +
        '<a href="index.html#compare" class="btn btn-ghost">看完整对比表</a>' +
        '<a href="join.html" class="btn btn-primary">加入社群</a>' +
      '</div>';
    }

    function resetWizard() {
      currentStep = 0;
      answers = {};
      document.getElementById('wizardContainer').style.display = 'block';
      document.getElementById('progress').style.display = 'flex';
      document.getElementById('resultContainer').style.display = 'none';
      document.getElementById('resultContainer').innerHTML = '';
      renderQuestion();
    }
    window.resetWizard = resetWizard;

    document.addEventListener('DOMContentLoaded', initWizard);
  </script>
</body>
</html>
