# hot-trend 配置文件
# 复制为 config.yaml，按需修改

llm:
  # provider 选一个：zhipu / openai / anthropic / deepseek / kimi / bailian / ark
  # 国内推荐 zhipu（智谱 GLM），稳定且便宜
  provider: zhipu
  model: glm-5.2
  api_key_env: ZHIPU_API_KEY  # 实际 key 从 .env 读取
  # base_url 留空则按 provider 自动查表；自定义中转时可填
  # base_url: https://open.bigmodel.cn/api/paas/v4/
  temperature: 0.3

scoring:
  incubate_threshold: 22   # 总分 >=22 标 "值得孵化"
  watch_threshold: 18      # 18-21 标 "观察"，<18 标 "丢弃"

# 机会卡输出目录（相对当前工作目录）
opportunities_dir: opportunities/cards

