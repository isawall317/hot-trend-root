<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Coding 工具对比 - 饭庐者说的 AI 编程工具选型指南</title>
<meta name="description" content="Claude Code、Cursor、Copilot、Trae... 20+ 款 AI 编程工具，从 12 个维度帮你比清楚到底该用哪个，覆盖 8 大场景。">
<style>
/* === Design Tokens === */
:root {
  --bg-base: #090d14;
  --bg-elevated: #111827;
  --bg-card: rgba(20, 28, 46, 0.7);
  --bg-card-hover: rgba(30, 41, 64, 0.85);
  --bg-input: rgba(15, 23, 42, 0.8);

  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-tertiary: #94a3b8;
  --text-muted: #64748b;

  --border-subtle: rgba(148, 163, 184, 0.1);
  --border-default: rgba(148, 163, 184, 0.18);
  --border-strong: rgba(148, 163, 184, 0.3);

  --accent: #6366f1;
  --accent-soft: rgba(99, 102, 241, 0.12);
  --accent-glow: rgba(99, 102, 241, 0.25);
  --accent-secondary: #818cf8;

  --color-positive: #10b981;
  --color-negative: #ef4444;
  --color-warning: #f59e0b;
  --color-info: #6366f1;
  --color-premium: #818cf8;

  --font-sans: "Geist", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.45);

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  --container-max: 1280px;
  --nav-height: 56px;
}

/* === Reset === */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-primary);
  line-height: 1.6;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(99, 102, 241, 0.08), transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 0%, rgba(129, 140, 248, 0.06), transparent 60%);
  pointer-events: none;
  z-index: 0;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
ul, ol { list-style: none; }
input, select { font: inherit; }

/* === Layout === */
.container { width: 100%; max-width: var(--container-max); margin: 0 auto; padding: 0 var(--space-5); position: relative; z-index: 1; }
.section { padding: var(--space-10) 0; position: relative; z-index: 1; }
.section + .section { border-top: 1px solid var(--border-subtle); }
.section-sm { padding: var(--space-6) 0; }
.section-sm + .section-sm { border-top: 1px solid var(--border-subtle); }

/* === Navigation === */
.nav {
  position: sticky; top: 0; z-index: 100;
  height: var(--nav-height);
  background: rgba(9, 13, 20, 0.85);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border-subtle);
}
.nav-inner { max-width: var(--container-max); margin: 0 auto; padding: 0 var(--space-5); height: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.nav-brand { display: flex; align-items: center; gap: var(--space-2); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; flex-shrink: 0; }
.nav-brand-name { background: linear-gradient(135deg, var(--text-primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nav-tabs { display: flex; align-items: center; gap: var(--space-1); }
.nav-tab { padding: var(--space-1) var(--space-3); border-radius: var(--radius-md); font-size: 13px; font-weight: 500; color: var(--text-tertiary); transition: all 0.15s ease; white-space: nowrap; }
.nav-tab:hover { color: var(--text-primary); background: var(--bg-card); }
.nav-tab.active { color: var(--accent); background: var(--accent-soft); }
.nav-cta { display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-3); background: var(--accent); color: #fff; border-radius: var(--radius-full); font-size: 12px; font-weight: 700; transition: transform 0.15s ease, box-shadow 0.15s ease; box-shadow: 0 2px 8px var(--accent-glow); }
.nav-cta:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }

/* === Tab Panels === */
.tab-panel { display: none; padding: var(--space-6) 0; min-height: 60vh; }
.tab-panel.active { display: block; }

/* === Buttons === */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); padding: var(--space-2) var(--space-5); border-radius: var(--radius-md); font-size: 13px; font-weight: 600; transition: all 0.15s ease; white-space: nowrap; cursor: pointer; border: 1px solid transparent; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 8px var(--accent-glow); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px var(--accent-glow); }
.btn-secondary { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-default); }
.btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
.btn-ghost { color: var(--text-secondary); }
.btn-ghost:hover { color: var(--text-primary); background: var(--bg-card); }
.btn-lg { padding: var(--space-3) var(--space-6); font-size: 14px; }
.btn-sm { padding: var(--space-1) var(--space-3); font-size: 12px; }

/* === Badges & Tags === */
.badge { display: inline-flex; align-items: center; gap: var(--space-1); padding: 2px var(--space-2); border-radius: var(--radius-sm); font-size: 11px; font-weight: 600; letter-spacing: 0.02em; background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
.badge-accent { background: var(--accent-soft); color: var(--accent); border-color: rgba(99, 102, 241, 0.3); }
.badge-premium { background: rgba(251, 191, 36, 0.12); color: var(--color-premium); border-color: rgba(251, 191, 36, 0.25); }
.badge-positive { background: rgba(16, 185, 129, 0.12); color: var(--color-positive); }
.badge-negative { background: rgba(239, 68, 68, 0.12); color: var(--color-negative); }
.badge-warning { background: rgba(245, 158, 11, 0.12); color: var(--color-warning); }
.tag { display: inline-flex; align-items: center; padding: 2px var(--space-2); border-radius: var(--radius-sm); font-size: 11px; font-weight: 500; background: var(--bg-elevated); color: var(--text-tertiary); border: 1px solid var(--border-subtle); }

/* === Stars === */
.stars { display: inline-flex; gap: 1px; font-size: 12px; letter-spacing: 1px; color: var(--color-premium); }
.stars-dim { color: var(--text-muted); }

/* === Hero === */
.hero { padding: var(--space-10) 0 var(--space-8); position: relative; z-index: 1; }
.hero-inner { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-8); align-items: center; }
.hero-title { font-size: clamp(28px, 4vw, 40px); font-weight: 800; line-height: 1.15; letter-spacing: -0.03em; margin-bottom: var(--space-3); }
.hero-title-accent { background: linear-gradient(135deg, var(--accent), var(--accent-secondary)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-subtitle { font-size: 15px; color: var(--text-secondary); line-height: 1.6; margin-bottom: var(--space-5); max-width: 48ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); padding: var(--space-4); background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }
.hero-stat-value { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--accent); font-variant-numeric: tabular-nums; }
.hero-stat-label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }

/* === Section Header === */
.section-header { margin-bottom: var(--space-6); }
.section-eyebrow { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: var(--space-2); }
.section-title { font-size: clamp(20px, 3vw, 28px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: var(--space-2); }
.section-subtitle { font-size: 14px; color: var(--text-tertiary); max-width: 60ch; }
.text-center { text-align: center; }

/* === Quick Entries === */
.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); }
.quick-card { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1); padding: var(--space-4); background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); text-align: left; transition: all 0.15s ease; cursor: pointer; }
.quick-card:hover { background: var(--bg-card-hover); border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.quick-card-icon { font-size: 22px; line-height: 1; }
.quick-card-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.quick-card-desc { font-size: 12px; color: var(--text-tertiary); }

/* === Top Picks === */
.top-pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
.top-pick-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-5); position: relative; overflow: hidden; }
.top-pick-card.pick-best { border-color: rgba(99, 102, 241, 0.3); background: linear-gradient(135deg, rgba(99, 102, 241, 0.06), var(--bg-card)); }
.top-pick-card.pick-best::before { content: 'BEST'; position: absolute; top: 12px; right: -28px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 32px; transform: rotate(45deg); letter-spacing: 0.08em; }
.top-pick-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: var(--space-2); }
.top-pick-vendor { font-size: 18px; font-weight: 700; margin-bottom: var(--space-1); }
.top-pick-plan { font-size: 13px; color: var(--text-tertiary); margin-bottom: var(--space-3); }
.top-pick-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-subtle); }
.top-pick-metric-value { font-size: 14px; font-weight: 700; font-family: var(--font-mono); }
.top-pick-metric-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.top-pick-reason { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-top: var(--space-3); padding: var(--space-3); background: var(--bg-elevated); border-radius: var(--radius-md); }
.top-pick-action { margin-top: var(--space-3); text-align: right; }

/* === Recommendation Cards === */
.reco-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--space-4); }
.reco-item { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-5); transition: all 0.15s ease; }
.reco-item:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.reco-item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); margin-bottom: var(--space-2); }
.reco-item-vendor { font-size: 17px; font-weight: 700; }
.reco-item-plan { font-size: 12px; color: var(--text-tertiary); }
.reco-item-verdict { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px var(--space-3); border-radius: var(--radius-full); margin-bottom: var(--space-3); }
.reco-item-reasons { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); }
.reco-item-reasons li { position: relative; padding-left: var(--space-4); font-size: 13px; line-height: 1.5; color: var(--text-secondary); }
.reco-item-reasons li::before { content: ''; position: absolute; left: 0; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.reco-item-reasons strong { color: var(--text-primary); font-weight: 600; }
.reco-item-footer { display: flex; justify-content: space-between; align-items: center; padding-top: var(--space-3); border-top: 1px solid var(--border-subtle); }

/* === Filter Bar === */
.filter-bar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding: var(--space-3); background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); margin-bottom: var(--space-4); }
.filter-chip { display: inline-flex; align-items: center; padding: var(--space-1) var(--space-3); background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-full); font-size: 12px; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all 0.12s ease; }
.filter-chip:hover { color: var(--text-primary); border-color: var(--border-strong); }
.filter-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.filter-select { padding: var(--space-1) var(--space-3); background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-primary); font-size: 12px; cursor: pointer; }
.filter-stats { margin-left: auto; font-size: 12px; color: var(--text-tertiary); }
.filter-stats strong { color: var(--accent); font-weight: 700; }

/* === Combo Cards Grid === */
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: var(--space-4); }
.tool-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-5); transition: all 0.15s ease; display: flex; flex-direction: column; }
.tool-card:hover { border-color: var(--border-strong); background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.tool-card.featured { border-color: rgba(99, 102, 241, 0.25); background: linear-gradient(135deg, rgba(99, 102, 241, 0.04), var(--bg-card)); }
.tool-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); margin-bottom: var(--space-2); }
.tool-card-name { font-size: 16px; font-weight: 700; color: var(--text-primary); }
.tool-card-scenario { font-size: 11px; color: var(--text-muted); }
.tool-card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.55; margin-bottom: var(--space-3); flex: 1; }

/* === Tool Chain === */
.tool-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); margin-bottom: var(--space-3); padding: var(--space-3); background: var(--bg-elevated); border-radius: var(--radius-md); }
.tool-tool { display: flex; flex-direction: column; align-items: center; padding: var(--space-1) var(--space-2); background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); min-width: 60px; text-align: center; }
.tool-tool-name { font-size: 11px; font-weight: 700; color: var(--text-primary); }
.tool-tool-role { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.tool-tool-arrow { font-size: 14px; color: var(--text-muted); flex-shrink: 0; }

/* === Combo Meta === */
.tool-card-tags { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-3); }
.tool-card-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); padding: var(--space-3) 0; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); margin-bottom: var(--space-3); }
.tool-card-meta-item { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.tool-card-meta-value { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.tool-card-pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-bottom: var(--space-3); }
.tool-card-pros, .tool-card-cons { font-size: 11px; line-height: 1.5; }
.tool-card-pros strong { color: var(--color-positive); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
.tool-card-cons strong { color: var(--color-warning); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
.tool-card-pros ul, .tool-card-cons ul { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
.tool-card-pros li { color: var(--text-secondary); padding-left: var(--space-3); position: relative; }
.tool-card-pros li::before { content: '✓'; position: absolute; left: 0; color: var(--color-positive); font-size: 10px; }
.tool-card-cons li { color: var(--text-tertiary); padding-left: var(--space-3); position: relative; }
.tool-card-cons li::before { content: '✗'; position: absolute; left: 0; color: var(--text-muted); font-size: 10px; }
.tool-card-footer { display: flex; justify-content: space-between; align-items: center; }

/* Scenario Badge Colors */
.sc-frontend { background: rgba(236, 72, 153, 0.12); color: #f472b6; border-color: rgba(236, 72, 153, 0.25); }
.sc-backend { background: rgba(16, 185, 129, 0.12); color: #34d399; border-color: rgba(16, 185, 129, 0.25); }
.sc-fullstack { background: rgba(99, 102, 241, 0.12); color: #818cf8; border-color: rgba(99, 102, 241, 0.25); }
.sc-solo { background: rgba(245, 158, 11, 0.12); color: #818cf8; border-color: rgba(245, 158, 11, 0.25); }
.sc-team { background: rgba(139, 92, 246, 0.12); color: #a78bfa; border-color: rgba(139, 92, 246, 0.25); }

/* === Recent Changes === */
.rc-list { display: flex; flex-direction: column; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
.rc-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border-subtle); font-size: 13px; line-height: 1.4; transition: background 0.12s ease; position: relative; }
.rc-item:last-child { border-bottom: none; }
.rc-item:hover { background: var(--bg-card-hover); }
.rc-item.rc-featured { border-left: 3px solid var(--accent); padding-left: calc(var(--space-4) - 3px); }
.rc-date { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); flex-shrink: 0; width: 42px; }
.rc-title { color: var(--text-secondary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-title a { color: var(--text-secondary); }
.rc-title a:hover { color: var(--accent); }
.rc-vendor { color: var(--text-primary); font-weight: 600; }
.rc-item:hover .rc-title { white-space: normal; overflow: visible; }
.rc-item[data-detail]:hover::after {
  content: attr(data-detail);
  position: absolute; bottom: calc(100% + 6px); left: var(--space-4);
  background: var(--bg-elevated); color: var(--text-primary);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
  border: 1px solid var(--border-default);
  font-size: 12px; line-height: 1.5; white-space: normal; width: min(400px, 80vw);
  z-index: 10; box-shadow: var(--shadow-md);
  pointer-events: none;
}

/* === Community === */
.community-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
.community-card { position: relative; padding: var(--space-6); border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); overflow: hidden; }
.community-card-free { background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.6)); }
.community-card-paid { background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(129, 140, 248, 0.05)); border-color: rgba(99, 102, 241, 0.25); }
.community-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
.community-card-title { font-size: 18px; font-weight: 700; }
.community-card-subtitle { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: var(--space-3); }
.community-card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.55; margin-bottom: var(--space-4); }
.community-highlights { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-5); }
.community-highlights li { font-size: 12px; color: var(--text-secondary); padding-left: var(--space-4); position: relative; }
.community-highlights li::before { content: ''; position: absolute; left: 0; top: 6px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

/* === Footer === */
.footer { padding: var(--space-8) 0 var(--space-6); border-top: 1px solid var(--border-subtle); position: relative; z-index: 1; }

<script>
const DATA = JSON.parse(document.getElementById('cp-data').textContent);
const { site, tools, changes } = DATA;
// Utils
function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}
function renderStars(rating) {
  const full = '★'.repeat(rating);
  const empty = '☆'.repeat(5 - rating);
  return '<span class="stars">' + full + '</span><span class="stars stars-dim">' + empty + '</span>';
}
function renderTagsInline(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join(' ');
}
function renderMarkdownLite(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return html;
}

const SCENARIO_LABELS = {
  frontend: '前端开发', backend: '后端开发', fullstack: '全栈开发',
  solo: '独立开发', team: '团队协作', prototype: '快速原型',
  docs: '文档写作', devops: 'DevOps', ui: 'UI设计',
  oss: '开源维护', learning: '学习入门', mobile: '移动端',
  research: '学术研究', quality: '质量保障'
};
const TYPE_CSS = {
  frontend: 'sc-frontend', backend: 'sc-backend', fullstack: 'sc-fullstack',
  solo: 'sc-solo', team: 'sc-team'
};
const DIFFICULTY_LABELS = { '入门': '🟢 入门', '进阶': '🟡 进阶', '专家': '🔴 专家' };
const COST_LABELS = { '免费': '免费', '低成本': '低成本', '中等': '中等', '高': '高费用' };

function scenarioLabel(s) { return SCENARIO_LABELS[s] || s; }
function scenarioCss(s) { return SCENARIO_CSS[s] || ''; }

// Tab 路由
function switchTab(hash) {
  const tab = (hash || '#recommend').replace(/^#/, '').split('?')[0];
  const validTabs = ['recommend', 'browse', 'community'];
  const target = validTabs.includes(tab) ? tab : 'recommend';
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + target).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === target));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.addEventListener('hashchange', () => switchTab(location.hash));

function renderRecommend(){
  document.getElementById('recommend-body').innerHTML=renderHero()+renderTopTools()+renderQuickEntries()+renderRecommendations()+renderRecentChanges();
  bindQuickEntries();
}
function renderHero(){
  const h=site.header||{};
  const stats=(h.stats||[]).map(s=>'<div><div class="hero-stat-value">'+escapeHtml(s.value)+'<span style="font-size:13px;color:var(--text-tertiary);font-weight:500;margin-left:2px;">'+escapeHtml(s.unit||'')+'</span></div><div class="hero-stat-label">'+escapeHtml(s.label)+'</div></div>').join('');
  return'<section class="hero"><div class="container"><div class="hero-inner"><div>'+
    '<span class="section-eyebrow">'+escapeHtml(h.updateDate||'')+'</span>'+
    '<h1 class="hero-title">AI 编程工具<br><span class="hero-title-accent">22 款到底选哪个？</span></h1>'+
    '<p class="hero-subtitle">'+escapeHtml(site.tagline||'')+'</p>'+
    '<p style="font-size:13px;color:var(--text-tertiary);margin-bottom:var(--space-5);margin-top:-12px;">'+escapeHtml(h.highlights||'')+'</p>'+
    '<div class="hero-actions"><a href="#browse" class="btn btn-primary btn-lg">对比所有工具</a><a href="#community" class="btn btn-secondary btn-lg">订阅周刊</a></div>'+
    '<div class="hero-stats">'+stats+'</div></div></div></section>';
}
function renderTopTools(){
  const top3=[...tools].filter(t=>t.featured).sort((a,b)=>b.rating-a.rating).slice(0,3);
  if(!top3.length)return'';
  const labels=['综合之王','开箱即用','开源最强'];
  const reasons=['编程能力、生态和灵活性的综合冠军。Claude Code 是所有 AI 编程工具的标杆。','不想折腾配置、不想学 CLI？Cursor 开箱即用，500 万用户的选择。','完全免费、高度可定制、支持任意模型。开源社区最活跃的 AI 编程工具。'];
  return'<section class="section-sm"><div class="container"><div class="section-header" style="margin-bottom:var(--space-4);"><span class="section-eyebrow">TOP PICKS</span><h2 class="section-title">不知道选哪个？先看这三款</h2><p class="section-subtitle">基于编程能力、易用性和生态的综合推荐。点击场景卡片筛选或浏览全部 22 款工具。</p></div><div class="top-pick-grid">'+top3.map((t,i)=>{const isBest=i===0;return'<div class="top-pick-card'+(isBest?' pick-best':'')+'"><div class="top-pick-label">'+labels[i]+'</div><div class="top-pick-vendor">'+escapeHtml(t.name)+'</div><div class="top-pick-plan">'+escapeHtml(t.vendor)+' · '+escapeHtml(t.type)+' · '+escapeHtml(t.pricing.split('。')[0])+'</div><div style="margin-top:var(--space-3);">'+renderStars(t.rating)+'</div><div class="top-pick-metrics"><div><div class="top-pick-metric-value">'+t.features.length+'</div><div class="top-pick-metric-label">功能数</div></div><div><div class="top-pick-metric-value">'+t.platforms.length+'</div><div class="top-pick-metric-label">平台</div></div></div><div class="top-pick-reason">'+reasons[i]+'</div><div class="top-pick-action"><a href="#browse" class="btn btn-primary btn-sm">查看详情 →</a></div></div>'}).join('')+'</div></div></section>';
}
function renderQuickEntries(){
  const entries=site.quickEntries||[];if(!entries.length)return'';
  return'<section class="section-sm"><div class="container"><div class="section-header" style="margin-bottom:var(--space-4);"><span class="section-eyebrow">SCENARIOS</span><h2 class="section-title">按你的需求来找</h2></div><div class="quick-grid">'+entries.map(q=>'<button class="quick-card" data-entry-id="'+escapeHtml(q.id)+'"><span class="quick-card-icon">'+escapeHtml(q.icon)+'</span><span class="quick-card-title">'+escapeHtml(q.title)+'</span><span class="quick-card-desc">'+escapeHtml(q.desc)+'</span></button>').join('')+'</div></div></section>';
}
function bindQuickEntries(){document.querySelectorAll('.quick-card').forEach(card=>{card.addEventListener('click',()=>{const id=card.dataset.entryId;const entry=(site.quickEntries||[]).find(q=>q.id===id);if(!entry||!entry.filter)return;location.hash='#browse?'+Object.entries(entry.filter).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&')})})}
function renderRecommendations(){
  const groups=site.recommendationGroups||[];if(!groups.length)return'';const html=groups.map((group,gi)=>{const items=(group.items||[]).map(item=>{const t=tools.find(t=>t.id===item.toolId);if(!t)return'';return'<div class="reco-item"><div class="reco-item-header"><div><div class="reco-item-vendor">'+escapeHtml(t.name)+'</div><div class="reco-item-plan">'+escapeHtml(t.vendor)+' · '+escapeHtml(t.type)+'</div></div>'+renderStars(item.rating)+'</div>'+(item.verdict?'<span class="reco-item-verdict">'+escapeHtml(item.verdict)+'</span>':'')+'<p style="font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:var(--space-3);">'+escapeHtml(t.description)+'</p><div style="background:var(--bg-elevated);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-3);"><strong style="color:var(--accent);font-size:11px;">💰 价格</strong><p style="font-size:13px;color:var(--text-primary);margin-top:2px;">'+escapeHtml(t.pricing)+'</p></div><ul class="reco-item-reasons" style="margin-bottom:var(--space-3);">'+(t.strengths||[]).slice(0,2).map(s=>'<li>'+escapeHtml(s)+'</li>').join('')+'</ul><div class="reco-item-footer"><span style="font-size:12px;color:var(--text-tertiary);">'+t.platforms.map(p=>escapeHtml(p)).join(' · ')+'</span><a href="'+(t.websiteUrl||'#')+'" target="_blank" rel="nofollow sponsored" class="btn btn-primary">官网 →</a></div></div>'}).join('');const header=groups.length>1?'<div style="margin-bottom:var(--space-4);"><h3 style="font-size:16px;font-weight:700;">'+escapeHtml(group.title)+'</h3>'+(group.subtitle?'<p style="font-size:13px;color:var(--text-tertiary);">'+escapeHtml(group.subtitle)+'</p>':'')+'</div>':'';return'<div style="'+(gi>0?'margin-top:var(--space-8);':'')+'">'+header+'<div class="reco-list">'+items+'</div></div>'}).join('');return'<section class="section-sm"><div class="container"><div class="section-header" style="margin-bottom:var(--space-4);"><span class="section-eyebrow">ALL RECOMMENDATIONS</span><h2 class="section-title">饭庐者说的完整推荐</h2></div>'+html+'</div></section>';
}
const KIND_LABEL={new_tool:'新工具',tool_update:'更新',article:'文章'};
function renderRecentChanges(){const now=new Date();const cutoff=new Date(now.getTime()-30*24*60*60*1000);const recent=(changes||[]).filter(c=>new Date(c.date)>=cutoff).sort((a,b)=>b.date.localeCompare(a.date));if(!recent.length)return'';const items=recent.map(c=>{const impactBadge=c.impact==='positive'?'<span class="badge badge-positive">利好</span>':c.impact==='negative'?'<span class="badge badge-negative">利空</span>':'<span class="badge">中性</span>';const kindLabel='<span class="tag">'+(KIND_LABEL[c.kind]||c.kind)+'</span>';const titleHtml=c.kind==='article'&&c.sourceUrl?'<a href="'+escapeHtml(c.sourceUrl)+'" target="_blank" rel="noopener">'+escapeHtml(c.title)+'</a>':escapeHtml(c.title);const detailAttr=c.detail&&c.detail!==c.title?' data-detail="'+escapeHtml(c.detail).replace(/"/g,'&quot;')+'"':'';return'<div class="rc-item'+(c.featured?' rc-featured':'')+'"'+detailAttr+'><span class="rc-date">'+escapeHtml(c.date.slice(5))+'</span>'+impactBadge+'<span class="rc-title">'+titleHtml+'</span>'+kindLabel+'</div>'}).join('');return'<section class="section-sm"><div class="container"><div class="section-header" style="margin-bottom:var(--space-4);"><span class="section-eyebrow">RECENT CHANGES</span><h2 class="section-title">最近动态</h2><p class="section-subtitle">最近30天AI编程工具生态的关键变动。悬停查看详情。</p></div><div class="rc-list">'+items+'</div></div></section>';}


const browseState={filters:{types:new Set,tags:new Set,search:''},sort:{key:null,dir:'asc'}};
function renderBrowse(){document.getElementById('browse-body').innerHTML=renderBrowseSection();bindBrowseFilters();renderToolCards();}
function renderBrowseSection(){return'<section class="section-sm"><div class="container"><div class="section-header"><span class="section-eyebrow">COMPARE ALL</span><h2 class="section-title">全部工具对比</h2><p class="section-subtitle">从 12 个维度对比 22 款 AI 编程工具。点击筛选，搜索关键词。</p></div><div id="browseFilterBar"></div><div class="tool-grid" id="toolGrid"></div></div></section>';}
function renderBrowseFilterBar(){const types=[...new Set(tools.map(t=>t.type))].sort();const allTags=new Set();tools.forEach(t=>(t.tags||[]).forEach(t=>allTags.add(t)));const tagList=[...allTags].sort();const typeChips=types.map(t=>'<button class="filter-chip" data-filter-type="types" data-filter-value="'+escapeHtml(t)+'">'+escapeHtml(t)+'</button>').join('');const tagChips=tagList.map(t=>'<button class="filter-chip" data-filter-type="tags" data-filter-value="'+escapeHtml(t)+'">'+escapeHtml(t)+'</button>').join('');return'<div class="filter-bar"><select class="filter-select" id="sortSelect"><option value="">默认排序</option><option value="rating-desc">评分 高-低</option><option value="name-asc">名称 A-Z</option><option value="addedAt-desc">最新收录</option></select><input type="text" class="filter-select" id="searchInput" placeholder="搜索工具名/厂商/模型..." style="min-width:200px;"><button class="filter-chip" id="resetBtn">重置</button><span class="filter-stats">显示 <strong id="filterCount">0</strong> / '+tools.length+' 款工具</span></div>'+(typeChips?'<div class="filter-bar"><span style="font-size:11px;font-weight:700;color:var(--text-muted);">类型:</span>'+typeChips+'</div>':'')+(tagChips?'<div class="filter-bar"><span style="font-size:11px;font-weight:700;color:var(--text-muted);">标签:</span>'+tagChips+'</div>':'');}
function bindBrowseFilters(){const fm=document.getElementById('browseFilterBar');if(!fm)return;fm.innerHTML=renderBrowseFilterBar();const hf=(()=>{const h=location.hash;const q=h.indexOf('?');if(q<0)return null;const p=new URLSearchParams(h.slice(q+1));const f={};for(const[k,v]of p)f[k]=v;return f})();if(hf){if(hf.type)browseState.filters.types.add(hf.type);if(hf.tag)browseState.filters.tags.add(hf.tag);if(hf.pricing===true||hf.pricing==='free')browseState.filters.search='免费';if(hf.search){browseState.filters.search=hf.search.toLowerCase();const si=document.getElementById('searchInput');if(si)si.value=hf.search}}syncFilter();fm.querySelectorAll('.filter-chip[data-filter-type]').forEach(chip=>{chip.addEventListener('click',()=>{const type=chip.dataset.filterType,value=chip.dataset.filterValue,set=browseState.filters[type];if(set.has(value))set.delete(value);else set.add(value);syncFilter();renderToolCards()})});document.getElementById('resetBtn')?.addEventListener('click',()=>{browseState.filters.types.clear();browseState.filters.tags.clear();browseState.filters.search='';browseState.sort={key:null,dir:'asc'};document.getElementById('sortSelect').value='';document.getElementById('searchInput').value='';syncFilter();renderToolCards()});document.getElementById('sortSelect')?.addEventListener('change',()=>{const v=document.getElementById('sortSelect').value;if(!v)browseState.sort={key:null,dir:'asc'};else{const[k,d]=v.split('-');browseState.sort={key:k,dir:d}}renderToolCards()});document.getElementById('searchInput')?.addEventListener('input',()=>{browseState.filters.search=document.getElementById('searchInput').value.trim().toLowerCase();renderToolCards()})}
function syncFilter(){document.querySelectorAll('.filter-chip[data-filter-type]').forEach(chip=>{const type=chip.dataset.filterType,value=chip.dataset.filterValue,active=browseState.filters[type]&&browseState.filters[type].has(value);chip.classList.toggle('active',!!active)})}
function filterTools(){const f=browseState.filters;let r=tools.filter(t=>{if(f.types.size&&!f.types.has(t.type))return false;if(f.tags.size&&!(t.tags||[]).some(t=>f.tags.has(t)))return false;if(f.search){const h=(t.name+' '+t.vendor+' '+t.description+' '+t.type+' '+(t.tags||[]).join(' ')+(t.modelIntegration||[]).join(' ')+(t.features||[]).join(' ')).toLowerCase();if(!h.includes(f.search))return false}return true});const{key,dir}=browseState.sort;if(key)r.sort((a,b)=>{const av=a[key],bv=b[key];if(key==='name'){return dir==='asc'?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av))}if(key==='addedAt'){return dir==='asc'?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av))}const aNum=typeof av==='number'?av:0;const bNum=typeof bv==='number'?bv:0;return dir==='asc'?aNum-bNum:bNum-aNum});return r}
function renderToolCards(){const filtered=filterTools();const countEl=document.getElementById('filterCount');if(countEl)countEl.textContent=filtered.length;const grid=document.getElementById('toolGrid');if(!filtered.length){if(grid)grid.innerHTML='<div style="text-align:center;padding:48px;color:var(--text-muted);grid-column:1/-1;">没有匹配的工具，试试重置筛选</div>';return}if(grid)grid.innerHTML=filtered.map(t=>{const isFeatured=t.featured;const fb=isFeatured?'<span class="badge badge-accent" style="font-size:10px;">⭐ 精选</span>':'';const tb=t.trending?'<span class="badge badge-warning" style="font-size:10px;">🔥 热门</span>':'';return'<div class="tool-card'+(isFeatured?' featured':'')+'"><div class="tool-card-header"><div><div class="tool-card-name">'+escapeHtml(t.name)+' '+tb+fb+'</div><div class="tool-card-scenario">'+escapeHtml(t.vendor)+' · '+escapeHtml(t.type)+'</div></div><span class="badge">'+escapeHtml(t.type)+'</span></div><p class="tool-card-desc">'+escapeHtml(t.description)+'</p><div class="tool-card-tags">'+renderTagsInline(t.tags)+'</div><div style="background:var(--bg-elevated);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-3);"><strong style="color:var(--accent);font-size:11px;">💰 价格</strong><p style="font-size:13px;color:var(--text-primary);margin-top:2px;">'+escapeHtml(t.pricing)+'</p></div><div class="tool-card-meta"><div><div class="tool-card-meta-value">'+renderStars(t.rating)+'</div><div class="tool-card-meta-item">评分</div></div><div><div class="tool-card-meta-value">'+t.features.length+'</div><div class="tool-card-meta-item">功能</div></div><div><div class="tool-card-meta-value">'+(t.modelIntegration||[]).length+'</div><div class="tool-card-meta-item">模型</div></div><div><div class="tool-card-meta-value">'+t.platforms.length+'</div><div class="tool-card-meta-item">平台</div></div></div><div style="margin-bottom:var(--space-3);"><strong style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">🤖 支持模型</strong><p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">'+(t.modelIntegration||[]).slice(0,4).map(m=>escapeHtml(m)).join(' · ')+((t.modelIntegration||[]).length>4?' ...':'')+'</p></div><div style="margin-bottom:var(--space-3);"><strong style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">🔧 核心功能</strong><p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">'+(t.features||[]).slice(0,5).map(f=>'<span class="tag" style="margin:1px;">'+escapeHtml(f)+'</span>').join('')+'</p></div><div style="margin-bottom:var(--space-3);"><strong style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">📋 Coding Plan 关系</strong><p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">'+escapeHtml(t.codingPlanRelation)+'</p></div><div class="tool-card-pros-cons"><div class="tool-card-pros"><strong>👍 优势</strong><ul>'+(t.strengths||[]).slice(0,3).map(s=>'<li>'+escapeHtml(s)+'</li>').join('')+'</ul></div><div class="tool-card-cons"><strong>👎 不足</strong><ul>'+(t.weaknesses||[]).slice(0,3).map(w=>'<li>'+escapeHtml(w)+'</li>').join('')+'</ul></div></div><div class="tool-card-footer"><span style="font-size:12px;color:var(--text-tertiary);">'+t.platforms.map(p=>escapeHtml(p)).join(' · ')+'</span><a href="'+(t.websiteUrl||'#')+'" target="_blank" rel="nofollow sponsored" class="btn btn-primary btn-sm">官网 →</a></div></div>'}).join('')}


function renderCommunity() {
  const body = document.getElementById('community-body');
  const c = site.community;
  if (!c) { body.innerHTML = ''; return; }
  body.innerHTML = '<section class="section-sm"><div class="container">' +
    '<div class="section-header text-center">' +
      '<span class="section-eyebrow">COMMUNITY</span>' +
      '<h2 class="section-title">不止看数据，来群里聊</h2>' +
      '<p class="section-subtitle" style="margin:0 auto;">通过本站链接注册工具，不影响你的价格，工具方会给我返佣。支持本站持续运营。</p>' +
    '</div>' +
    '<div class="community-grid">' +
      renderCommunityCard(c.free, 'free', 'FREE', 'badge-accent', '#') +
      renderCommunityCard(c.paid, 'paid', 'PRO', 'badge-premium', c.paid && c.paid.url ? c.paid.url : '#') +
    '</div>' +
  '</div></section>';
}

function renderCommunityCard(card, type, badgeText, badgeClass, actionUrl) {
  if (!card) return '';
  const highlights = (card.highlights || []).map(h => '<li>' + escapeHtml(h) + '</li>').join('');
  return '<div class="community-card community-card-' + type + '">' +
    '<div class="community-card-header"><h3 class="community-card-title">' + escapeHtml(card.title) + '</h3><span class="badge ' + badgeClass + '">' + badgeText + '</span></div>' +
    '<div class="community-card-subtitle">' + escapeHtml(card.subtitle) + '</div>' +
    '<p class="community-card-desc">' + escapeHtml(card.description) + '</p>' +
    '<ul class="community-highlights">' + highlights + '</ul>' +
    '<a href="' + escapeHtml(actionUrl) + '" class="btn ' + (type === 'paid' ? 'btn-primary' : 'btn-secondary') + ' btn-lg">' + escapeHtml(card.ctaText) + '</a>' +
  '</div>';
}

function renderFooter() {
  const fb = document.getElementById('footer-body');
  if (!fb) return;
  const links = (site.footer && site.footer.links || []).map(l => '<a href="' + escapeHtml(l.url) + '">' + escapeHtml(l.label) + '</a>').join('');
  fb.innerHTML =
    '<div class="footer-disclosure">' + escapeHtml(site.disclosure || '') + '</div>' +
    '<div class="footer-inner">' +
      '<div class="footer-brand">' + escapeHtml((site.footer && site.footer.about) || '') + '</div>' +
      '<div class="footer-links">' + links + '</div>' +
    '</div>';
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('navBrand').textContent = site.name || 'AI Coding 工具对比';
  renderRecommend();
  renderBrowse();
  renderCommunity();
  renderFooter();
  switchTab(location.hash || '#recommend');
});
</script>
</body>
</html>
