<script>
// ============================================================
// Claude Code Skills 精选 - 单文件版（3 Tab + hash 路由）
// 模板拆分: template/scripts/*.js → build.py 组装
// ============================================================
const DATA = JSON.parse(document.getElementById('cp-data').textContent);
const { site, skills, changes } = DATA;

// Utils
function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}
function formatNumber(value) {
  if (value === null || value === undefined || value === '-') return '—';
  if (typeof value === 'string') return value;
  if (value >= 1000) return value.toLocaleString();
  return value;
}
function renderStars(rating) {
  const full = '★'.repeat(rating);
  const empty = '☆'.repeat(5 - rating);
  return '<span class="stars">' + full + '</span><span class="stars stars-dim">' + empty + '</span>';
}
function renderTagsInline(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join(' ');
}
function renderMarkdownLite(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return html;
}

const CATEGORY_LABELS = {
  coding: '编码提效', workflow: '工作流', docs: '文档写作', ui: 'UI设计', utility: '效率工具'
};
const CATEGORY_CSS = {
  coding: 'cat-coding', workflow: 'cat-workflow', docs: 'cat-docs', ui: 'cat-ui', utility: 'cat-utility'
};
function categoryLabel(cat) { return CATEGORY_LABELS[cat] || cat; }
function categoryCss(cat) { return CATEGORY_CSS[cat] || ''; }

// Tab 路由
function switchTab(hash) {
  const tab = (hash || '#recommend').replace(/^#/, '').split('?')[0];
  const validTabs = ['recommend', 'browse', 'community'];
  const target = validTabs.includes(tab) ? tab : 'recommend';

  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + target).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === target));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.addEventListener('hashchange', () => switchTab(location.hash));

// ============================================================
// Tab 1: 推荐（Hero + Top Skills + Quick Entries + Recommendations + Recent Changes）
// ============================================================
function renderRecommend() {
  const body = document.getElementById('recommend-body');
  body.innerHTML = renderHero() + renderTopSkills() + renderQuickEntries() + renderRecommendations() + renderRecentChanges();
  bindQuickEntries();
}

function renderHero() {
  const h = site.header || {};
  const stats = (h.stats || []).map(s =>
    '<div><div class="hero-stat-value">' + escapeHtml(s.value) +
    '<span style="font-size:13px;color:var(--text-tertiary);font-weight:500;margin-left:2px;">' + escapeHtml(s.unit || '') + '</span></div>' +
    '<div class="hero-stat-label">' + escapeHtml(s.label) + '</div></div>'
  ).join('');
  return '<section class="hero"><div class="container"><div class="hero-inner"><div>' +
    '<span class="section-eyebrow">' + escapeHtml(h.updateDate || '') + '</span>' +
    '<h1 class="hero-title">Claude Code Skills<br><span class="hero-title-accent">哪些值得装？</span></h1>' +
    '<p class="hero-subtitle">' + escapeHtml(site.tagline || '') + '</p>' +
    '<p style="font-size:13px;color:var(--text-tertiary);margin-bottom:var(--space-5);margin-top:-12px;">' + escapeHtml(h.highlights || '') + '</p>' +
    '<div class="hero-actions">' +
      '<a href="#browse" class="btn btn-primary btn-lg">浏览全部 Skills</a>' +
      '<a href="#community" class="btn btn-secondary btn-lg">加入社群</a>' +
    '</div>' +
    '<div class="hero-stats">' + stats + '</div>' +
  '</div></div></section>';
}

function renderTopSkills() {
  const top3 = skills
    .filter(s => s.featured)
    .sort((a, b) => b.rating - a.rating || (b.installs || '').localeCompare(a.installs || ''))
    .slice(0, 3);
  if (!top3.length) return '';

  const labels = ['综合最佳', '本周最热', '编辑推荐'];
  const reasons = [
    '综合评分最高，装了这个 Skill 后 Claude Code 的能力提升最明显。',
    '最近一周安装量增长最快，社区讨论度最高的 Skill。',
    '编辑团队实测后认为最被低估的 Skill，用过的都说好。'
  ];
  const picks = top3.map((s, i) => {
    const isBest = i === 0;
    return '<div class="top-pick-card' + (isBest ? ' pick-best' : '') + '">' +
      '<div class="top-pick-label">' + labels[i] + '</div>' +
      '<div class="top-pick-vendor">' + escapeHtml(s.name) + '</div>' +
      '<div class="top-pick-plan">by ' + escapeHtml(s.author) + ' · ' + categoryLabel(s.category) + '</div>' +
      '<div style="margin-top:var(--space-3);">' + renderStars(s.rating) + '</div>' +
      '<div class="top-pick-metrics">' +
        '<div><div class="top-pick-metric-value">' + escapeHtml(s.installs) + '</div><div class="top-pick-metric-label">安装量</div></div>' +
        '<div><div class="top-pick-metric-value">' + (s.scenarios || []).length + '</div><div class="top-pick-metric-label">适用场景</div></div>' +
      '</div>' +
      '<div class="top-pick-reason">' + reasons[i] + '</div>' +
      '<div class="top-pick-action">' +
        '<a href="' + (s.githubUrl || '#') + '" target="_blank" rel="nofollow sponsored" class="btn btn-primary btn-sm">查看详情 →</a>' +
      '</div>' +
    '</div>';
  }).join('');
  return '<section class="section-sm"><div class="container">' +
    '<div class="section-header" style="margin-bottom:var(--space-4);">' +
      '<span class="section-eyebrow">TOP PICKS</span>' +
      '<h2 class="section-title">不知道装哪个？先看这三个</h2>' +
      '<p class="section-subtitle">基于评分、安装量和社区口碑的综合推荐。点击场景卡片筛选或浏览全部 Skills。</p>' +
    '</div>' +
    '<div class="top-pick-grid">' + picks + '</div>' +
  '</div></section>';
}

function renderQuickEntries() {
  const entries = site.quickEntries || [];
  if (!entries.length) return '';
  const cards = entries.map(q =>
    '<button class="quick-card" data-entry-id="' + escapeHtml(q.id) + '">' +
      '<span class="quick-card-icon">' + escapeHtml(q.icon) + '</span>' +
      '<span class="quick-card-title">' + escapeHtml(q.title) + '</span>' +
      '<span class="quick-card-desc">' + escapeHtml(q.desc) + '</span>' +
    '</button>'
  ).join('');
  return '<section class="section-sm"><div class="container">' +
    '<div class="section-header" style="margin-bottom:var(--space-4);">' +
      '<span class="section-eyebrow">SCENARIOS</span>' +
      '<h2 class="section-title">按你的场景来找</h2>' +
    '</div>' +
    '<div class="quick-grid">' + cards + '</div>' +
  '</div></section>';
}

function bindQuickEntries() {
  document.querySelectorAll('.quick-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.entryId;
      const entry = (site.quickEntries || []).find(q => q.id === id);
      if (!entry || !entry.filter) return;
      const query = Object.entries(entry.filter).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
      location.hash = '#browse' + (query ? '?' + query : '');
    });
  });
}

function renderRecommendations() {
  const groups = site.recommendationGroups || [];
  if (!groups.length) return '';
  const html = groups.map((group, gi) => {
    const items = (group.items || []).map(item => {
      const skill = skills.find(s => s.id === item.skillId);
      if (!skill) return '';
      const pros = (skill.pros || []).slice(0, 2).map(p => '<li>' + escapeHtml(p) + '</li>').join('');
      return '<div class="reco-item">' +
        '<div class="reco-item-header"><div><div class="reco-item-vendor">' + escapeHtml(skill.name) + '</div><div class="reco-item-plan">by ' + escapeHtml(skill.author) + ' · ' + categoryLabel(skill.category) + '</div></div>' + renderStars(item.rating) + '</div>' +
        (item.verdict ? '<span class="reco-item-verdict">' + escapeHtml(item.verdict) + '</span>' : '') +
        '<p style="font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:var(--space-3);">' + escapeHtml(skill.description) + '</p>' +
        (pros ? '<ul class="reco-item-reasons" style="margin-bottom:var(--space-3);">' + pros + '</ul>' : '') +
        '<div class="reco-item-footer">' +
          '<span style="font-family:var(--font-mono);font-size:12px;color:var(--text-tertiary);">' + escapeHtml(skill.installs) + ' 安装</span>' +
          '<a href="' + (skill.githubUrl || '#') + '" target="_blank" rel="nofollow sponsored" class="btn btn-primary">查看详情 →</a>' +
        '</div></div>';
    }).join('');
    const header = groups.length > 1
      ? '<div style="margin-bottom:var(--space-4);"><h3 style="font-size:16px;font-weight:700;">' + escapeHtml(group.title) + '</h3>' + (group.subtitle ? '<p style="font-size:13px;color:var(--text-tertiary);">' + escapeHtml(group.subtitle) + '</p>' : '') + '</div>'
      : '';
    return '<div style="' + (gi > 0 ? 'margin-top:var(--space-8);' : '') + '">' + header + '<div class="reco-list">' + items + '</div></div>';
  }).join('');
  return '<section class="section-sm"><div class="container">' +
    '<div class="section-header" style="margin-bottom:var(--space-4);">' +
      '<span class="section-eyebrow">ALL RECOMMENDATIONS</span>' +
      '<h2 class="section-title">饭庐者说的完整推荐</h2>' +
    '</div>' + html + '</div></section>';
}

// 最近变动（紧凑单行时间线）
const KIND_LABEL = {
  new_skill: '新Skill', skill_update: '更新', article: '文章', trend: '趋势'
};

function renderRecentChanges() {
  const now = new Date();
  const cutoff = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
  const recent = (changes || [])
    .filter(c => new Date(c.date) >= cutoff)
    .sort((a, b) => b.date.localeCompare(a.date));
  if (!recent.length) return '';

  const items = recent.map(c => {
    const impactBadge = c.impact === 'positive' ? '<span class="badge badge-positive">利好</span>'
      : c.impact === 'negative' ? '<span class="badge badge-negative">利空</span>'
      : '<span class="badge">中性</span>';
    const kindLabel = '<span class="tag">' + (KIND_LABEL[c.kind] || c.kind) + '</span>';
    const vendorPrefix = c.vendor && c.vendor !== '通用' ? '<span class="rc-vendor">' + escapeHtml(c.vendor) + '</span> · ' : '';
    const isArticle = c.kind === 'article';
    const titleHtml = isArticle && c.sourceUrl
      ? '<a href="' + escapeHtml(c.sourceUrl) + '" target="_blank" rel="noopener">' + escapeHtml(c.title) + '</a>'
      : escapeHtml(c.title);
    const detailAttr = c.detail && c.detail !== c.title ? ' data-detail="' + escapeHtml(c.detail).replace(/"/g, '&quot;') + '"' : '';
    return '<div class="rc-item' + (c.featured ? ' rc-featured' : '') + '"' + detailAttr + '>' +
      '<span class="rc-date">' + escapeHtml(c.date.slice(5)) + '</span>' +
      impactBadge +
      '<span class="rc-title">' + vendorPrefix + titleHtml + '</span>' +
      kindLabel +
    '</div>';
  }).join('');

  return '<section class="section-sm">' +
    '<div class="container">' +
      '<div class="section-header" style="margin-bottom:var(--space-4);">' +
        '<span class="section-eyebrow">RECENT CHANGES</span>' +
        '<h2 class="section-title">最近动态 · Skills 生态变化</h2>' +
        '<p class="section-subtitle">最近 30 天 Skills 生态的关键变动。悬停查看详情。</p>' +
      '</div>' +
      '<div class="rc-list">' + items + '</div>' +
    '</div>' +
  '</section>';
}

// ============================================================
// Tab 2: 浏览（筛选栏 + Skill 卡片网格 + 搜索）
// ============================================================
const browseState = {
  filters: { categories: new Set(), tags: new Set(), search: '' },
  sort: { key: null, dir: 'asc' }
};

function renderBrowse() {
  const body = document.getElementById('browse-body');
  body.innerHTML = renderBrowseSection();
  bindBrowseFilters();
  renderSkillCards();
}

function renderBrowseSection() {
  return '<section class="section-sm">' +
    '<div class="container">' +
      '<div class="section-header" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:var(--space-3);">' +
        '<div>' +
          '<span class="section-eyebrow">BROWSE ALL</span>' +
          '<h2 class="section-title">全部 Skills</h2>' +
          '<p class="section-subtitle">点击分类筛选，搜索框输入关键词。找到适合你的 Skill。</p>' +
        '</div>' +
      '</div>' +
      '<div id="browseFilterBar"></div>' +
      '<div class="skill-grid" id="skillGrid"></div>' +
    '</div></section>';
}

function renderBrowseFilterBar() {
  const categories = [...new Set(skills.map(s => s.category))].sort();
  const allTags = new Set();
  skills.forEach(s => (s.tags || []).forEach(t => allTags.add(t)));
  const tags = [...allTags].sort();

  const catChips = categories.map(c => '<button class="filter-chip" data-filter-type="categories" data-filter-value="' + escapeHtml(c) + '">' + categoryLabel(c) + '</button>').join('');
  const tagChips = tags.map(t => '<button class="filter-chip" data-filter-type="tags" data-filter-value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</button>').join('');

  return '<div class="filter-bar">' +
    '<select class="filter-select" id="sortSelect">' +
      '<option value="">默认排序</option>' +
      '<option value="rating-desc">评分 高-低</option>' +
      '<option value="installs-desc">安装量 多-少</option>' +
      '<option value="addedAt-desc">最新收录</option>' +
    '</select>' +
    '<input type="text" class="filter-select" id="searchInput" placeholder="搜索 Skill 名称 / 描述..." style="min-width:200px;">' +
    '<button class="filter-chip" id="resetBtn">重置</button>' +
    '<span class="filter-stats">显示 <strong id="filterCount">0</strong> / ' + skills.length + ' 个 Skills</span>' +
  '</div>' +
  (catChips ? '<div class="filter-bar"><span style="font-size:11px;font-weight:700;color:var(--text-muted);">分类:</span>' + catChips + '</div>' : '') +
  (tagChips ? '<div class="filter-bar"><span style="font-size:11px;font-weight:700;color:var(--text-muted);">标签:</span>' + tagChips + '</div>' : '');
}

function parseHashFilter() {
  const hash = location.hash;
  const qIdx = hash.indexOf('?');
  if (qIdx < 0) return null;
  const params = new URLSearchParams(hash.slice(qIdx + 1));
  const f = {};
  for (const [k, v] of params) f[k] = v;
  return f;
}

function bindBrowseFilters() {
  const fm = document.getElementById('browseFilterBar');
  if (!fm) return;
  fm.innerHTML = renderBrowseFilterBar();

  const hashFilter = parseHashFilter();
  if (hashFilter) {
    if (hashFilter.category) browseState.filters.categories.add(hashFilter.category);
    if (hashFilter.tag) browseState.filters.tags.add(hashFilter.tag);
    if (hashFilter.search) {
      browseState.filters.search = hashFilter.search.toLowerCase();
      const si = document.getElementById('searchInput');
      if (si) si.value = hashFilter.search;
    }
  }
  syncBrowseFilterUI();

  fm.querySelectorAll('.filter-chip[data-filter-type]').forEach(chip => {
    chip.addEventListener('click', () => {
      const type = chip.dataset.filterType;
      const value = chip.dataset.filterValue;
      const set = browseState.filters[type];
      if (set.has(value)) set.delete(value); else set.add(value);
      syncBrowseFilterUI();
      renderSkillCards();
    });
  });

  const reset = document.getElementById('resetBtn');
  if (reset) reset.addEventListener('click', () => {
    browseState.filters.categories.clear();
    browseState.filters.tags.clear();
    browseState.filters.search = '';
    browseState.sort = { key: null, dir: 'asc' };
    const ss = document.getElementById('sortSelect'); if (ss) ss.value = '';
    const si = document.getElementById('searchInput'); if (si) si.value = '';
    syncBrowseFilterUI();
    renderSkillCards();
  });

  const ss = document.getElementById('sortSelect');
  if (ss) ss.addEventListener('change', () => {
    const val = ss.value;
    if (!val) browseState.sort = { key: null, dir: 'asc' };
    else { const [k, d] = val.split('-'); browseState.sort = { key: k, dir: d }; }
    renderSkillCards();
  });

  const si = document.getElementById('searchInput');
  if (si) si.addEventListener('input', () => {
    browseState.filters.search = si.value.trim().toLowerCase();
    renderSkillCards();
  });
}

function syncBrowseFilterUI() {
  document.querySelectorAll('.filter-chip[data-filter-type]').forEach(chip => {
    const type = chip.dataset.filterType;
    const value = chip.dataset.filterValue;
    const active = browseState.filters[type] && browseState.filters[type].has(value);
    chip.classList.toggle('active', !!active);
  });
}

function filterSkills() {
  const f = browseState.filters;
  let result = skills.filter(s => {
    if (f.categories.size && !f.categories.has(s.category)) return false;
    if (f.tags.size && !(s.tags || []).some(t => f.tags.has(t))) return false;
    if (f.search) {
      const hay = (s.name + ' ' + s.description + ' ' + s.author + ' ' + (s.tags || []).join(' ') + ' ' + (s.scenarios || []).join(' ')).toLowerCase();
      if (!hay.includes(f.search)) return false;
    }
    return true;
  });
  const { key, dir } = browseState.sort;
  if (key) {
    result.sort((a, b) => {
      const av = a[key], bv = b[key];
      if (key === 'installs') {
        const aNum = parseInt(String(av).replace(/[^0-9]/g, '')) || 0;
        const bNum = parseInt(String(bv).replace(/[^0-9]/g, '')) || 0;
        return dir === 'asc' ? aNum - bNum : bNum - aNum;
      }
      if (key === 'addedAt') {
        return dir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
      }
      const aNum = typeof av === 'number' ? av : 0;
      const bNum = typeof bv === 'number' ? bv : 0;
      return dir === 'asc' ? aNum - bNum : bNum - aNum;
    });
  }
  return result;
}

function renderSkillCards() {
  const filtered = filterSkills();
  const countEl = document.getElementById('filterCount');
  if (countEl) countEl.textContent = filtered.length;
  const grid = document.getElementById('skillGrid');

  if (!filtered.length) {
    if (grid) grid.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text-muted);grid-column:1/-1;">没有匹配的 Skill，试试重置筛选</div>';
    return;
  }

  if (grid) {
    grid.innerHTML = filtered.map(s => {
      const pros = (s.pros || []).slice(0, 2).map(p => '<li>' + escapeHtml(p) + '</li>').join('');
      const cons = (s.cons || []).slice(0, 2).map(c => '<li>' + escapeHtml(c) + '</li>').join('');
      const isFeatured = s.featured;
      const trendingBadge = s.trending ? '<span class="badge badge-warning" style="font-size:10px;">🔥 热门</span>' : '';
      const featuredBadge = s.featured ? '<span class="badge badge-accent" style="font-size:10px;">⭐ 精选</span>' : '';

      return '<div class="skill-card' + (isFeatured ? ' featured' : '') + '">' +
        '<div class="skill-card-header">' +
          '<div>' +
            '<div class="skill-card-name">' + escapeHtml(s.name) + ' ' + trendingBadge + featuredBadge + '</div>' +
            '<div class="skill-card-author">by ' + escapeHtml(s.author) + '</div>' +
          '</div>' +
          '<span class="badge ' + categoryCss(s.category) + '">' + categoryLabel(s.category) + '</span>' +
        '</div>' +
        '<p class="skill-card-desc">' + escapeHtml(s.description) + '</p>' +
        '<div class="skill-card-tags">' + renderTagsInline(s.tags) + '</div>' +
        '<div class="skill-card-meta">' +
          '<div><div class="skill-card-meta-value">' + renderStars(s.rating) + '</div><div class="skill-card-meta-item">评分</div></div>' +
          '<div><div class="skill-card-meta-value">' + escapeHtml(s.installs) + '</div><div class="skill-card-meta-item">安装量</div></div>' +
        '</div>' +
        '<div class="skill-card-pros-cons">' +
          (pros ? '<div class="skill-card-pros"><strong>👍 优点</strong><ul>' + pros + '</ul></div>' : '<div></div>') +
          (cons ? '<div class="skill-card-cons"><strong>👎 注意</strong><ul>' + cons + '</ul></div>' : '<div></div>') +
        '</div>' +
        '<div class="skill-card-footer">' +
          '<span class="skill-card-installs">' + (s.scenarios || []).slice(0, 2).map(sc => escapeHtml(sc)).join(' · ') + '</span>' +
          '<a href="' + (s.githubUrl || '#') + '" target="_blank" rel="nofollow sponsored" class="btn btn-primary btn-sm">安装 →</a>' +
        '</div>' +
      '</div>';
    }).join('');
  }
}

// ============================================================
// Tab 3: 社群 + Footer
// ============================================================
function renderCommunity() {
  const body = document.getElementById('community-body');
  const c = site.community;
  if (!c) { body.innerHTML = ''; return; }
  body.innerHTML = '<section class="section-sm"><div class="container">' +
    '<div class="section-header text-center">' +
      '<span class="section-eyebrow">COMMUNITY</span>' +
      '<h2 class="section-title">不止看数据，来群里聊</h2>' +
      '<p class="section-subtitle" style="margin:0 auto;">Skill 创作者申请精选位，让你的作品被 10 万+ 开发者看到。标注「赞助」保持透明。</p>' +
    '</div>' +
    '<div class="community-grid">' +
      renderCommunityCard(c.free, 'free', 'FREE', 'badge-accent', 'join.html') +
      renderCommunityCard(c.paid, 'paid', 'PRO', 'badge-premium', c.paid && c.paid.url ? c.paid.url : '#') +
    '</div>' +
  '</div></section>';
}

function renderCommunityCard(card, type, badgeText, badgeClass, actionUrl) {
  if (!card) return '';
  const highlights = (card.highlights || []).map(h => '<li>' + escapeHtml(h) + '</li>').join('');
  return '<div class="community-card community-card-' + type + '">' +
    '<div class="community-card-header"><h3 class="community-card-title">' + escapeHtml(card.title) + '</h3><span class="badge ' + badgeClass + '">' + badgeText + '</span></div>' +
    '<div class="community-card-subtitle">' + escapeHtml(card.subtitle) + '</div>' +
    '<p class="community-card-desc">' + escapeHtml(card.description) + '</p>' +
    '<ul class="community-highlights">' + highlights + '</ul>' +
    '<a href="' + escapeHtml(actionUrl) + '" class="btn ' + (type === 'paid' ? 'btn-primary' : 'btn-secondary') + ' btn-lg">' + escapeHtml(card.ctaText) + '</a>' +
  '</div>';
}

function renderFooter() {
  const fb = document.getElementById('footer-body');
  if (!fb) return;
  const links = (site.footer && site.footer.links || []).map(l => '<a href="' + escapeHtml(l.url) + '">' + escapeHtml(l.label) + '</a>').join('');
  fb.innerHTML =
    '<div class="footer-disclosure">' + escapeHtml(site.disclosure || '') + '</div>' +
    '<div class="footer-inner">' +
      '<div class="footer-brand">' + escapeHtml((site.footer && site.footer.about) || '') + '</div>' +
      '<div class="footer-links">' + links + '</div>' +
    '</div>';
}

// ============================================================
// Init — 页面加载时初始化所有 Tab
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('navBrand').textContent = site.name || 'Claude Code Skills 精选';
  renderRecommend();
  renderBrowse();
  renderCommunity();
  renderFooter();
  switchTab(location.hash || '#recommend');
});
</script>
