<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodingPlan 省钱攻略 - 7 家 AI Coding Plan / Token Plan 定价对比</title>
<meta name="description" content="智谱/字节方舟/腾讯/DeepSeek/MiniMax/Kimi/阿里百炼 7 家厂商 Coding Plan / Token Plan / API 按量定价对比。数据源官网快照，支持月订阅与 API 按量两套评测。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* === Inlined from template/style.css === */
/* ============================================================
   CodingPlan 省钱攻略 — 瑞士国际主义风 (Swiss Style)
   参考 guizang-ppt-skill Swiss Style: 克莱因蓝 IKB + 灰白底
   设计原则: 高级灰白底 + 单一高亮色 + 全无衬线 + 极致字号对比
   ============================================================ */

:root {
  /* ============ 主题色 · 克莱因蓝 IKB ============ */
  --paper: #fafaf8;
  --ink: #0a0a0a;
  --grey-1: #f0f0ee;
  --grey-2: #d4d4d2;
  --grey-3: #737373;
  --accent: #002fa7;
  --accent-rgb: 0, 47, 167;
  --accent-on: #ffffff;

  /* ============ 文本角色 token (role-based) ============ */
  --text-primary: #0a0a0a;
  --text-secondary: #525252;
  --text-helper: #737373;
  --text-placeholder: #a3a3a3;
  --border-subtle: #e0e0e0;
  --border-strong: #a3a3a3;
  /* === 兼容旧 JS 引用的别名 === */
  --border: #e0e0e0;
  --text-muted: #737373;
  --text-tertiary: #a3a3a3;
  --color-warning: #002fa7;

  /* ============ 字体 (全无衬线) ============ */
  --sans: "Inter", "Helvetica Neue", "Helvetica", "Arial", "Segoe UI", system-ui, -apple-system, sans-serif;
  --sans-zh: "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", "SF Mono", "Cascadia Code", "Consolas", monospace;

  /* ============ Carbon 2x Grid 间距模数 (基础 8px) ============ */
  --sp-3: 8px;
  --sp-4: 12px;
  --sp-5: 16px;
  --sp-6: 24px;
  --sp-7: 32px;
  --sp-8: 40px;
  --sp-9: 48px;
  --sp-10: 64px;

  /* ============ Motion ============ */
  --ease-prod: cubic-bezier(.2, 0, .38, .9);
  --dur-fast: .11s;
  --dur-mod: .15s;

  /* ============ 容器 ============ */
  --container-max: 1280px;
  --nav-height: 56px;
}

/* === Reset === */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans), var(--sans-zh);
  background: var(--paper);
  color: var(--text-primary);
  line-height: 1.6;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* === 容器 === */
.container { max-width: var(--container-max); margin: 0 auto; padding: 0 var(--sp-6); }

/* === Nav (瑞士风: 极简顶栏) === */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: var(--paper);
  border-bottom: 1px solid var(--border-subtle);
  height: var(--nav-height);
}
.nav-inner {
  max-width: var(--container-max); margin: 0 auto;
  padding: 0 var(--sp-6);
  height: 100%;
  display: flex; align-items: center; gap: var(--sp-5);
}
.nav-brand {
  text-decoration: none;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.nav-brand-name {
  display: inline-block;
}
.nav-tagline {
  font-size: 13px;
  color: var(--text-helper);
  font-weight: 500;
  border-left: 1px solid var(--border-subtle);
  padding-left: var(--sp-5);
}

/* === Section === */
.section-sm { padding: var(--sp-7) 0; }
.section-header { margin-bottom: var(--sp-5); }
.section-eyebrow {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: var(--sp-3);
}
.section-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1.2;
}
.section-subtitle {
  font-size: 13px;
  color: var(--text-helper);
  margin-top: var(--sp-3);
}

/* === 筛选条 / 快捷切换 === */
.filter-bar {
  display: flex; flex-wrap: wrap; gap: var(--sp-3);
  align-items: center;
  margin-bottom: var(--sp-4);
}
.filter-bar + .filter-bar { margin-top: var(--sp-3); }
.filter-chip {
  display: inline-flex; align-items: center;
  padding: 6px 12px;
  border: 1px solid var(--border-subtle);
  background: transparent;
  color: var(--text-secondary);
  border-radius: 0; /* 瑞士风: 直角 */
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--sans);
  transition: all var(--dur-fast) var(--ease-prod);
}
.filter-chip:hover { border-color: var(--ink); color: var(--ink); }
.filter-chip.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.filter-select {
  padding: 6px 12px;
  border: 1px solid var(--border-subtle);
  background: transparent;
  color: var(--text-secondary);
  border-radius: 0;
  font-size: 12px;
  font-family: var(--sans);
  cursor: pointer;
  outline: none;
}
.filter-select:focus { border-color: var(--accent); }
.filter-stats {
  font-size: 12px;
  color: var(--text-helper);
  font-family: var(--mono);
}

/* === 快捷切换按钮 (内联样式 override) === */
.quick-switch-btn {
  border-radius: 0 !important;
  font-family: var(--sans) !important;
}

/* === 表格 (瑞士风: 极简横线, 无圆角, 近黑边框) === */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border-subtle);
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  font-family: var(--sans);
}
.data-table th {
  text-align: left;
  padding: var(--sp-4) var(--sp-4);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-helper);
  border-bottom: 1px solid var(--ink);
  background: var(--grey-1);
  white-space: nowrap;
}
.data-table td {
  padding: var(--sp-4);
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: middle;
  color: var(--text-primary);
}
.data-table tr:hover td { background: var(--grey-1); }
.data-table .col-vendor { font-weight: 600; color: var(--ink); white-space: nowrap; }
.data-table .col-price { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.data-table .col-action { white-space: nowrap; }
.data-table .col-extra { font-size: 12px; }
.col-hidden { display: none; }

/* === Badge (瑞士风: 极小标签, 直角) === */
.badge {
  display: inline-block;
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 600;
  font-family: var(--mono);
  letter-spacing: 0.05em;
  background: var(--grey-1);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: 0;
}
.badge-warning { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }

/* === 评分星星 === */
.stars { color: var(--accent); font-size: 12px; letter-spacing: 1px; }
.stars .star-empty { color: var(--grey-2); }

/* === 按钮 (瑞士风: 直角, 克莱因蓝) === */
.btn {
  display: inline-flex; align-items: center;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--sans);
  text-decoration: none;
  border: 1px solid;
  border-radius: 0;
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-prod);
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: var(--accent-on);
  border-color: var(--accent);
}
.btn-primary:hover { background: #002080; border-color: #002080; }
.btn-sm { padding: 4px 10px; font-size: 11px; }

/* === 标签内联 === */
.tag-inline {
  display: inline-block;
  margin-right: 4px;
  font-size: 10px;
  font-family: var(--mono);
  color: var(--text-helper);
}

/* === 散点图卡片 === */
.chart-card {
  border: 1px solid var(--border-subtle);
  background: var(--paper);
  padding: var(--sp-5);
}
.chart-container {
  width: 100%;
  height: 420px;
}

/* === 移动端卡片视图 === */
.plan-cards-view { display: none; }
.plan-card-item {
  border: 1px solid var(--border-subtle);
  padding: var(--sp-4);
  background: var(--paper);
  margin-bottom: var(--sp-3);
}
.plan-card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: var(--sp-3);
}
.plan-card-vendor { font-weight: 700; font-size: 15px; color: var(--ink); }
.plan-card-plan { font-size: 12px; color: var(--text-helper); }
.plan-card-price { font-family: var(--mono); font-weight: 700; font-size: 16px; color: var(--accent); }

/* === Footer (瑞士风: 极简, 分割线) === */
.footer {
  border-top: 1px solid var(--border-subtle);
  background: var(--paper);
  padding: var(--sp-6) 0;
  margin-top: var(--sp-9);
}
.footer-disclosure {
  font-size: 11px;
  color: var(--text-helper);
  padding: 0 var(--sp-6) var(--sp-4);
  max-width: var(--container-max);
  margin: 0 auto;
  line-height: 1.7;
}
.footer-inner {
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--sp-6);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-4);
}
.footer-brand {
  font-size: 12px;
  color: var(--text-helper);
  font-family: var(--mono);
}
.footer-links {
  display: flex;
  gap: var(--sp-5);
}
.footer-links a {
  font-size: 12px;
  color: var(--text-secondary);
  text-decoration: none;
  font-weight: 500;
}
.footer-links a:hover { color: var(--accent); }

/* === 表格展开切换按钮 === */
.table-toggle-btn {
  border-radius: 0 !important;
}

/* === Hero (瑞士风: 大字号, 左对齐, 克莱因蓝强调) === */
.hero {
  padding: var(--sp-9) 0 var(--sp-8);
}
.hero-inner { }
.hero-title {
  font-size: clamp(30px, 4vw, 44px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: var(--sp-4);
  color: var(--ink);
}
.hero-title-accent { color: var(--accent); }
.hero-subtitle {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: var(--sp-5);
  max-width: 48ch;
}
.hero-actions {
  display: flex; flex-wrap: wrap; gap: var(--sp-3);
  margin-bottom: var(--sp-6);
}
.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--sp-5);
  padding: var(--sp-5) 0;
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}
.hero-stat-value {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--accent);
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}
.hero-stat-label {
  font-size: 11px;
  color: var(--text-helper);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-family: var(--mono);
  margin-top: var(--sp-2);
}

/* === Top3 推荐卡片 (瑞士风: 直角, 边框, 强调色高亮最佳) === */
.top-pick-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--sp-4);
}
.top-pick-card {
  border: 1px solid var(--border-subtle);
  padding: var(--sp-5);
  background: var(--paper);
  transition: border-color var(--dur-fast) var(--ease-prod);
}
.top-pick-card:hover { border-color: var(--ink); }
.top-pick-card.pick-best {
  border-color: var(--accent);
  border-width: 2px;
}
.top-pick-label {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: var(--sp-3);
}
.top-pick-vendor {
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.top-pick-plan {
  font-size: 12px;
  color: var(--text-helper);
  margin-bottom: var(--sp-3);
}
.top-pick-price {
  font-size: 28px;
  font-weight: 800;
  font-family: var(--mono);
  color: var(--ink);
  letter-spacing: -0.02em;
}
.top-pick-price-unit {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-helper);
}
.top-pick-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-3);
  margin: var(--sp-4) 0;
  padding: var(--sp-3) 0;
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}
.top-pick-metric-value {
  font-size: 18px;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--ink);
}
.top-pick-metric-label {
  font-size: 10px;
  color: var(--text-helper);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-family: var(--mono);
  margin-top: 2px;
}
.top-pick-reason {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
  margin-bottom: var(--sp-4);
}
.top-pick-action { }

/* === 推荐列表 (reco-item, 用于额外分组) === */
.reco-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--sp-4);
}
.reco-item {
  border: 1px solid var(--border-subtle);
  padding: var(--sp-5);
  background: var(--paper);
}
.reco-item-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: var(--sp-3);
  margin-bottom: var(--sp-2);
}
.reco-item-vendor { font-size: 16px; font-weight: 700; color: var(--ink); }
.reco-item-plan { font-size: 12px; color: var(--text-helper); }
.reco-item-verdict {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--accent);
  margin-bottom: var(--sp-3);
}
.reco-item-reasons {
  list-style: none;
  display: flex; flex-direction: column; gap: var(--sp-2);
  margin-bottom: var(--sp-4);
}
.reco-item-reasons li {
  position: relative;
  padding-left: var(--sp-4);
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-secondary);
}
.reco-item-reasons li::before {
  content: '';
  position: absolute;
  left: 0; top: 8px;
  width: 5px; height: 5px;
  background: var(--accent);
}
.reco-item-reasons strong { color: var(--ink); font-weight: 600; }
.reco-item-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: var(--sp-3);
  border-top: 1px solid var(--border-subtle);
}

/* === 场景卡片 (quick-card) === */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--sp-3);
}
.quick-card {
  display: flex; flex-direction: column; align-items: flex-start;
  gap: var(--sp-2);
  padding: var(--sp-4);
  background: var(--paper);
  border: 1px solid var(--border-subtle);
  text-align: left;
  cursor: pointer;
  font-family: var(--sans);
  transition: all var(--dur-fast) var(--ease-prod);
}
.quick-card:hover {
  border-color: var(--accent);
  background: var(--grey-1);
}
.quick-card-icon {
  font-size: 20px; line-height: 1;
  font-family: var(--mono); font-weight: 700;
  color: var(--accent);
}
.quick-card-title { font-size: 14px; font-weight: 700; color: var(--ink); }
.quick-card-desc { font-size: 12px; color: var(--text-helper); line-height: 1.5; }

/* === 最近变动 (rc-list) === */
.rc-list {
  border-top: 1px solid var(--border-subtle);
}
.rc-item {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: var(--sp-2) var(--sp-3);
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 13px;
}
.rc-item:hover { background: var(--grey-1); }
.rc-date {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-helper);
  font-weight: 600;
}
.rc-vendor {
  font-weight: 600;
  color: var(--text-secondary);
}
.rc-title { color: var(--text-primary); flex: 1; min-width: 0; }
.rc-title a { color: var(--accent); text-decoration: none; }
.rc-title a:hover { text-decoration: underline; }
.rc-featured { background: var(--grey-1); }

/* === Badge 扩展 (利好/利空) === */
.badge-positive { background: rgba(0, 47, 167, 0.08); color: var(--accent); border-color: rgba(0, 47, 167, 0.2); }
.badge-negative { background: rgba(115, 115, 115, 0.08); color: var(--grey-3); border-color: var(--border-subtle); }

/* === 最近变动弹窗 === */
.rc-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(10, 10, 10, 0.4);
  display: none;
  align-items: center; justify-content: center;
  z-index: 100;
  padding: var(--sp-5);
}
.rc-modal-overlay.rc-modal-open { display: flex; }
.rc-modal {
  background: var(--paper);
  border: 1px solid var(--border-subtle);
  width: 100%; max-width: 880px;
  max-height: 80vh;
  display: flex; flex-direction: column;
}
.rc-modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: var(--sp-5);
  border-bottom: 1px solid var(--border-subtle);
}
.rc-modal-header h3 { font-size: 16px; font-weight: 700; color: var(--ink); }
.rc-modal-close {
  border: none; background: transparent;
  font-size: 18px; cursor: pointer;
  color: var(--text-helper);
  padding: 4px 8px;
  line-height: 1;
}
.rc-modal-close:hover { color: var(--ink); }
.rc-modal-sub { font-size: 12px; color: var(--text-helper); padding: 0 var(--sp-5); margin-top: var(--sp-3); }
.rc-modal-body {
  overflow-y: auto;
  padding: var(--sp-3) var(--sp-5) var(--sp-5);
  flex: 1;
}

/* === Tag (内联标签) === */
.tag {
  display: inline-flex; align-items: center;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 500;
  font-family: var(--sans);
  background: var(--grey-1);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: 0;
}

/* === btn-secondary (Hero CTA) === */
.btn-secondary {
  background: transparent;
  color: var(--ink);
  border-color: var(--ink);
}
.btn-secondary:hover { background: var(--ink); color: var(--paper); }
.btn-lg { padding: 10px 20px; font-size: 13px; }

/* === 响应式 === */
@media (max-width: 768px) {
  .data-table { display: none; }
  .plan-cards-view { display: block; }
  .section-title { font-size: 22px; }
  .nav-tagline { display: none; }
  .footer-inner { flex-direction: column; align-items: flex-start; }
  .top-pick-grid { grid-template-columns: 1fr; }
  .quick-grid { grid-template-columns: 1fr 1fr; }
  .hero-stats { grid-template-columns: 1fr; gap: var(--sp-3); }
  .hero-stat-value { font-size: 22px; }
  .hero-title { font-size: 26px; }
  .top-pick-price { font-size: 24px; }
}

</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="#" class="nav-brand"><span class="nav-brand-name" id="navBrand">CP</span></a>
    <span class="nav-tagline" id="navTagline"></span>
  </div>

<script>
// ============================================================
// CodingPlan 省钱攻略 - 单文件版（3 Tab + hash 路由）
// 模板拆分: template/scripts/*.js → build.py 组装
// ============================================================
const DATA = JSON.parse(document.getElementById('cp-data').textContent);
const { site, vendors, plans, changes } = DATA;

// Utils（移植自 V1 shared.js）
function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}
function formatPrice(value, currency) {
  if (value === null || value === undefined || value === '-' || value === '') return '—';
  if (typeof value === 'string') return value;
  const prefix = currency === '$' ? '$' : '¥';
  return prefix + value;
}
function formatNumber(value) {
  if (value === null || value === undefined || value === '-') return '—';
  if (typeof value === 'string') return value;
  if (value >= 1000) return value.toLocaleString();
  return value;
}
function renderStars(rating) {
  const full = '★'.repeat(rating);
  const empty = '☆'.repeat(5 - rating);
  return '<span class="stars">' + full + '</span><span class="stars stars-dim">' + empty + '</span>';
}
function renderTagsInline(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join(' ');
}
function renderMarkdownLite(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return html;
}
function vendorColor(name) {
  const v = vendors.find(x => x.name === name);
  return v && v.color ? v.color : '#71717B';
}

// 单页模式，无 Tab 切换。保留 hashchange 监听以兼容旧书签。
function switchTab() {
  // 不再有 Tab，但散点图可能需要 resize
  if (window._chart) window._chart.resize();
}
window.addEventListener('hashchange', () => switchTab(location.hash));


// ============================================================
// Tab 1: 推荐（Hero + Top3 + 场景卡片 + 博主推荐 + 最近变动）
// ============================================================
function renderRecommend() {
  const body = document.getElementById('recommend-body');
  body.innerHTML = renderHero() + renderTopPicks() + renderQuickEntries() + renderRecommendations();
  bindQuickEntries();
  bindRecentChangesModal();
}

// 弹窗：最近变动
function bindRecentChangesModal() {
  // Hero "查看完整对比表" 平滑滚动到对比表
  const compareLink = document.querySelector('.hero-actions a[href="#compare"]');
  if (compareLink) {
    compareLink.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById('tab-compare');
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    });
  }
  // "最近变动"弹窗触发
  const trigger = document.getElementById('rcTrigger');
  if (!trigger) return;
  trigger.addEventListener('click', () => {
    // 避免重复注入
    let modal = document.getElementById('rcModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'rcModal';
      modal.className = 'rc-modal-overlay';
      modal.innerHTML = '<div class="rc-modal">' +
        '<div class="rc-modal-header">' +
          '<h3>最近变动 · 为什么这样推荐</h3>' +
          '<button class="rc-modal-close" id="rcModalClose">✕</button>' +
        '</div>' +
        '<p class="rc-modal-sub">最近 14 天影响套餐选择的关键变动。点击查看原文。</p>' +
        '<div class="rc-modal-body">' + renderRecentChangesList() + '</div>' +
      '</div>';
      document.body.appendChild(modal);
      // 点击遮罩关闭
      modal.addEventListener('click', e => {
        if (e.target === modal || e.target.id === 'rcModalClose') {
          modal.classList.remove('rc-modal-open');
          document.body.style.overflow = '';
        }
      });
    }
    modal.classList.add('rc-modal-open');
    document.body.style.overflow = 'hidden';
  });
}

// 抽取时间线渲染（弹窗内用，不含外层 section）
function renderRecentChangesList() {
  const now = new Date();
  const cutoff = new Date(now.getTime() - 14 * 24 * 60 * 60 * 1000);
  const recent = changes
    .filter(c => new Date(c.date) >= cutoff)
    .sort((a, b) => b.date.localeCompare(a.date));
  if (!recent.length) return '<p style="color:var(--text-helper);padding:var(--sp-5);">暂无近期变动</p>';

  const items = recent.map(c => {
    const impactBadge = c.impact === 'positive' ? '<span class="badge badge-positive">利好</span>'
      : c.impact === 'negative' ? '<span class="badge badge-negative">利空</span>'
      : '<span class="badge">中性</span>';
    const kindLabel = '<span class="tag">' + (KIND_LABEL[c.kind] || c.kind) + '</span>';
    const vendorPrefix = c.vendor && c.vendor !== '通用' ? '<span class="rc-vendor">' + escapeHtml(c.vendor) + '</span> · ' : '';
    const titleHtml = c.sourceUrl
      ? '<a href="' + escapeHtml(c.sourceUrl) + '" target="_blank" rel="noopener">' + escapeHtml(c.title) + '</a>'
      : escapeHtml(c.title);
    return '<div class="rc-item' + (c.featured ? ' rc-featured' : '') + '">' +
      '<span class="rc-date">' + escapeHtml(c.date.slice(5)) + '</span>' +
      impactBadge +
      '<span class="rc-title">' + vendorPrefix + titleHtml + '</span>' +
      kindLabel +
    '</div>';
  }).join('');
  return '<div class="rc-list">' + items + '</div>';
}

function renderHero() {
  const h = site.header || {};
  const stats = (h.stats || []).map(s =>
    '<div><div class="hero-stat-value">' + escapeHtml(s.value) +
    '<span style="font-size:13px;color:var(--text-tertiary);font-weight:500;margin-left:2px;">' + escapeHtml(s.unit || '') + '</span></div>' +
    '<div class="hero-stat-label">' + escapeHtml(s.label) + '</div></div>'
  ).join('');
  return '<section class="hero"><div class="container"><div class="hero-inner"><div>' +

function renderTopPicks() {
  // 优先读博主钦定推荐（site.recommendationGroups），读不到才 fallback 到算法
  const groups = site.recommendationGroups || [];
  const curated = groups[0] && groups[0].items && groups[0].items.length >= 3 ? groups[0].items.slice(0, 3) : null;

  let picksData;
  if (curated) {
    picksData = curated.map(item => {
      const p = plans.find(pl => pl.vendor === item.vendor && pl.plan === item.plan);
      return { item, plan: p };
    }).filter(d => d.plan); // 失配的丢掉
  }
  // fallback：算法排名
  if (!picksData || picksData.length < 3) {
    const scored = plans
      .filter(p => p.status === 'active' && typeof p.monthlyPrice === 'number' && typeof p.measuredMonthlyToken === 'number')
      .map(p => ({ plan: p, tpu: p.measuredMonthlyToken / p.monthlyPrice, score: p.rating * 10 + (p.measuredMonthlyToken / p.monthlyPrice) }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 3);
    picksData = scored.map((s, i) => ({
      item: { verdict: ['综合最佳', '高性价比', '入门首选'][i], reasons: ['综合评分最高，模型能力和性价比都很出色。', '每元能拿到更多 Token，花同样的钱可用更多。', '月费最低，适合预算有限或想先试试水的用户。'][i], rating: s.plan.rating, action: s.plan.action },
      plan: s.plan, tpu: s.tpu
    }));
  }

  if (!picksData.length) return '';
  const labels = ['综合最佳', '高性价比', '入门首选'];

  const picks = picksData.map((d, i) => {
    const p = d.plan;
    const item = d.item;
    const isBest = i === 0;
    const tpu = (typeof p.monthlyPrice === 'number' && typeof p.measuredMonthlyToken === 'number' && p.monthlyPrice > 0)
      ? (p.measuredMonthlyToken / p.monthlyPrice).toFixed(1) : '—';
    const tokenStr = typeof p.measuredMonthlyToken === 'number' ? p.measuredMonthlyToken + 'M' : '—';
    const verdict = item.verdict || labels[i];
    const reasons = (item.reasons || []).map(r => '<li>' + renderMarkdownLite(r) + '</li>').join('');
    const action = item.action || p.action || '#';
    return '<div class="top-pick-card' + (isBest ? ' pick-best' : '') + '">' +
      '<div class="top-pick-label">' + escapeHtml(labels[i]) + '</div>' +
      '<div class="top-pick-vendor">' + escapeHtml(p.vendor) + '</div>' +
      '<div class="top-pick-plan">' + escapeHtml(p.plan) + ' ' + escapeHtml(p.type) + '</div>' +
      '<div class="top-pick-price">' + formatPrice(p.monthlyPrice, p.currency || '¥') + '<span class="top-pick-price-unit">/月</span></div>' +
      '<div class="top-pick-metrics">' +
        '<div><div class="top-pick-metric-value">' + tokenStr + '</div><div class="top-pick-metric-label">月Token</div></div>' +
        '<div><div class="top-pick-metric-value">' + tpu + '</div><div class="top-pick-metric-label">每元Token</div></div>' +
      '</div>' +
      (verdict ? '<div class="top-pick-reason" style="font-weight:700;color:var(--accent);">' + escapeHtml(verdict) + '</div>' : '') +
      (reasons ? '<ul class="reco-item-reasons" style="margin:var(--space-2) 0 var(--space-4);">' + reasons + '</ul>' : '') +
      '<div class="top-pick-action">' +
        '<a href="' + action + '" target="_blank" rel="nofollow sponsored" class="btn btn-primary btn-sm">优惠购买 →</a>' +
      '</div>' +
    '</div>';
  }).join('');

  const subtitle = groups[0] && groups[0].subtitle ? groups[0].subtitle : '基于评分、性价比和真实体验的综合推荐。';
  return '<section class="section-sm"><div class="container">' +
    '<div class="section-header" style="margin-bottom:var(--space-4);">' +
      '<span class="section-eyebrow">TOP PICKS</span>' +
      '<h2 class="section-title">不知道买哪个？看这三个就够了</h2>' +
      '<p class="section-subtitle">' + escapeHtml(subtitle) + '</p>' +
    '</div>' +
    '<div class="top-pick-grid">' + picks + '</div>' +
  '</div></section>';
}

function bindQuickEntries() {
  document.querySelectorAll('.quick-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.entryId;
      const entry = (site.quickEntries || []).find(q => q.id === id);
      if (!entry || !entry.filter) return;
      // 直接应用筛选条件到 compareState 并重渲染（不设 hash，避免 reload 残留）
      const f = compareState.filters;
      f.types.clear(); f.tags.clear(); f.models.clear(); f.categories.clear();
      f.monthlyPriceMax = null; f.search = '';
      const si = document.getElementById('searchInput'); if (si) si.value = '';
      const ss = document.getElementById('sortSelect'); if (ss) ss.value = '';
      compareState.sort = { key: null, dir: 'asc' };
      for (const [k, v] of Object.entries(entry.filter)) {
        if (k === 'monthlyPriceMax') f.monthlyPriceMax = Number(v);
        else if (k === 'type') { f.types.clear(); f.types.add(v); }
        else if (k === 'types') { f.types.clear(); v.forEach(t => f.types.add(t)); }
        else if (k === 'tag') f.tags.add(v);
        else if (k === 'vendor') { f.search = String(v).toLowerCase(); if (si) si.value = v; }
        else if (k === 'model') f.models.add(v);
      }
      // 根据 types 决定 columnMode：API 按量→api 模式，否则 monthly
      if (f.types.size === 1 && f.types.has('API 按量')) {
        compareState.columnMode = 'api';
      } else if (f.types.size && !f.types.has('API 按量')) {
        compareState.columnMode = 'monthly';
      }
      if (typeof renderQuickSwitch === 'function') renderQuickSwitch();
      syncCompareFilterUI();
      renderCompareTable();
      renderChart();
      // 清掉残留 hash，避免 reload 时 parseHashFilter 重复筛选
      history.replaceState(null, '', '#compare');
      // 平滑滚动到对比表
      const target = document.getElementById('tab-compare');
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    });
  });
}

    .filter(c => new Date(c.date) >= cutoff)

  const items = recent.map(c => {

      : '<span class="badge">中性</span>';

function getColumns(mode) {
  const common = [{ key: 'vendor', label: '平台 / 套餐' }];
  const action = [{ key: 'action', label: '去购买', isAction: true }];
  if (mode === 'api') {
    return common.concat([
      { key: 'inputPrice', label: '输入价', unit: '元/M' },
      { key: 'outputPrice', label: '输出价', unit: '元/M' },
      { key: 'cachePrice', label: '缓存价', unit: '元/M' },
      { key: 'rateLimit', label: '并发/限速', isRateLimit: true },
      { key: 'contextLen', label: '上下文' },
    ]).concat(action);
  }
  if (mode === 'model') {
    return [
      { key: 'modelName', label: '模型', isModelName: true },
      { key: 'platformCount', label: '支持平台', isCount: true },
      { key: 'cheapestMonthly', label: '最便宜月订阅', isCheapest: true },
      { key: 'cheapestApi', label: '最便宜 API 按量', isCheapest: true },
      { key: 'action', label: '去购买', isAction: true },
    ];
  }
  // monthly 和 all 都用月订阅列（all 时 API 行的月费/月用量会是空，但能通过筛选切到 API 模式）
  return common.concat([
    { key: 'monthlyPrice', label: '月费', isPrice: true },
    { key: 'usage', label: '月用量' },
    { key: 'tpu', label: '每元Token', isTPU: true },
    { key: 'rateLimit', label: '限速', isRateLimit: true },
    { key: 'models', label: '关键模型' },
  ]).concat(action);
}

  const modelChips = allModels.slice(0, 12).map(m =>
    '<button class="filter-chip" data-filter-type="models" data-filter-value="' + escapeHtml(m) + '">' + escapeHtml(m) + '</button>'
  ).join('');

  return '<div class="filter-bar">' +
    '<select class="filter-select" id="sortSelect">' +
      '<option value="">默认排序</option>' +
      '<option value="monthlyPrice-asc">月费 低-高</option>' +
      '<option value="monthlyPrice-desc">月费 高-低</option>' +
      '<option value="measuredMonthlyToken-desc">月用量 多-少</option>' +
      '<option value="tokensPerYuan-desc">每元Token 高-低</option>' +
    '</select>' +
    '<input type="text" class="filter-select" id="searchInput" placeholder="搜索厂商/套餐..." style="min-width:160px;">' +
    '<button class="filter-chip" id="resetBtn">重置</button>' +
    '<span class="filter-stats">显示 <strong id="filterCount">0</strong> / ' + filterable.length + ' 个套餐</span>' +
  '</div>' +
  (modelChips ? '<div class="filter-bar"><span style="font-size:11px;font-weight:700;color:var(--text-helper);">模型:</span>' + modelChips + '</div>' : '');
}

function parseHashFilter() {
  const hash = location.hash;
  const qIdx = hash.indexOf('?');
  if (qIdx < 0) return null;
  const params = new URLSearchParams(hash.slice(qIdx + 1));
  const f = {};
  for (const [k, v] of params) f[k] = v;
  return f;
}

function bindCompareFilters() {
  const fm = document.getElementById('compareFilterBar');
  if (!fm) return;
  fm.innerHTML = renderCompareFilterBar();

  const hashFilter = parseHashFilter();
  if (hashFilter) {
    if (hashFilter.monthlyPriceMax) compareState.filters.monthlyPriceMax = Number(hashFilter.monthlyPriceMax);
    if (hashFilter.model) compareState.filters.models.add(hashFilter.model);
    if (hashFilter.tag) compareState.filters.tags.add(hashFilter.tag);
    if (hashFilter.vendor) {
      compareState.filters.search = hashFilter.vendor.toLowerCase();
      const si = document.getElementById('searchInput');
      if (si) si.value = hashFilter.vendor;
    }
  }
  syncCompareFilterUI();

  fm.querySelectorAll('.filter-chip[data-filter-type]').forEach(chip => {
    chip.addEventListener('click', () => {
      const type = chip.dataset.filterType;
      const value = chip.dataset.filterValue;
      const set = compareState.filters[type];
      if (set.has(value)) set.delete(value); else set.add(value);
      syncCompareFilterUI();
      renderCompareTable();
    });
  });

  const reset = document.getElementById('resetBtn');
  if (reset) reset.addEventListener('click', () => {
    compareState.filters.types.clear();
    compareState.filters.tags.clear();
    compareState.filters.models.clear();
    compareState.filters.monthlyPriceMax = null;
    compareState.filters.search = '';
    compareState.sort = { key: null, dir: 'asc' };
    const ss = document.getElementById('sortSelect'); if (ss) ss.value = '';
    const si = document.getElementById('searchInput'); if (si) si.value = '';
    syncCompareFilterUI();
    renderCompareTable();
  });

  const ss = document.getElementById('sortSelect');
  if (ss) ss.addEventListener('change', () => {
    const val = ss.value;
    if (!val) compareState.sort = { key: null, dir: 'asc' };
    else { const [k, d] = val.split('-'); compareState.sort = { key: k, dir: d }; }
    renderCompareTable();
  });

  const si = document.getElementById('searchInput');
  if (si) si.addEventListener('input', () => {
    compareState.filters.search = si.value.trim().toLowerCase();
    renderCompareTable();
  });

  const toggle = document.getElementById('toggleColumnsBtn');
  if (toggle) toggle.addEventListener('click', () => {
    compareState.columnsExpanded = !compareState.columnsExpanded;
    document.querySelectorAll('td.col-extra').forEach(c => c.classList.toggle('col-hidden', !compareState.columnsExpanded));
    toggle.textContent = compareState.columnsExpanded ? '收起额外列' : '展开全部列';
    toggle.classList.toggle('active', compareState.columnsExpanded);
  });
}

function syncCompareFilterUI() {
  document.querySelectorAll('.filter-chip[data-filter-type]').forEach(chip => {
    const type = chip.dataset.filterType;
    const value = chip.dataset.filterValue;
    const active = compareState.filters[type] && compareState.filters[type].has(value);
    chip.classList.toggle('active', !!active);
  });
}

function filterPlans() {
  const f = compareState.filters;
  let result = plans.filter(p => {
    if (p.status === 'deprecated') return false;
    if (f.types.size && !f.types.has(p.type)) return false;
    if (f.categories.size && !f.categories.has(p.category || 'model-maker')) return false;
    if (f.tags.size && !(p.tags || []).some(t => f.tags.has(t))) return false;
    if (f.models.size && !(p.models || []).some(m => f.models.has(m))) return false;
    if (f.monthlyPriceMax && typeof p.monthlyPrice === 'number' && p.monthlyPrice > f.monthlyPriceMax) return false;
    if (f.search) {
      const hay = (p.vendor + ' ' + p.plan + ' ' + (p.models || []).join(' ') + ' ' + (p.tags || []).join(' ')).toLowerCase();
      if (!hay.includes(f.search)) return false;
    }
    return true;
  });
  const { key, dir } = compareState.sort;
  if (key) {
    result.sort((a, b) => {
      if (key === 'tokensPerYuan') {
        const aVal = (typeof a.monthlyPrice === 'number' && typeof a.measuredMonthlyToken === 'number' && a.monthlyPrice > 0) ? a.measuredMonthlyToken / a.monthlyPrice : -1;
        const bVal = (typeof b.monthlyPrice === 'number' && typeof b.measuredMonthlyToken === 'number' && b.monthlyPrice > 0) ? b.measuredMonthlyToken / b.monthlyPrice : -1;
        return dir === 'asc' ? aVal - bVal : bVal - aVal;
      }
      const av = a[key], bv = b[key];
      const aNum = typeof av === 'number' ? av : (av === '无限制' ? Infinity : -1);
      const bNum = typeof bv === 'number' ? bv : (bv === '无限制' ? Infinity : -1);
      return dir === 'asc' ? aNum - bNum : bNum - aNum;
    });
  }
  return result;
}

function renderCompareTable() {
  const filtered = filterPlans();
  const countEl = document.getElementById('filterCount');
  if (countEl) countEl.textContent = filtered.length;
  const tbody = document.getElementById('plansTableBody');
  const cardsView = document.getElementById('plansCardsView');

  if (!filtered.length) {
    const empty = '<div style="text-align:center;padding:48px;color:var(--text-muted);">没有匹配的套餐，试试重置筛选</div>';
    if (tbody) tbody.innerHTML = '<tr><td colspan="99">' + empty + '</td></tr>';
    if (cardsView) cardsView.innerHTML = empty;
    return;
  }

  renderTableHead();
  // 非 calc 模式：恢复表格/图/筛选栏显示，隐藏 calcUI
  if (compareState.columnMode !== 'calc') {
    const calcUI = document.getElementById('calcUI');
    if (calcUI) calcUI.style.display = 'none';
    ['compareFilterBar', 'plansTableBody'].forEach(id => {
      const el = document.getElementById(id); if (el) el.style.display = '';
    });
    const tw = document.querySelector('.table-wrap'); if (tw) tw.style.display = '';
    const cc = document.querySelector('.chart-card'); if (cc) cc.style.display = '';
  }
  if (compareState.columnMode === 'calc') {
    renderCalculator();
    return;
  }
  if (compareState.columnMode === 'model') {
    renderModelRows(filtered);
    return;
  }
  if (tbody) {
    const cols = getColumns(compareState.columnMode);
    tbody.innerHTML = filtered.map(p => {
      const cells = cols.map(c => {
        if (c.isAction) {
          const buyBtn = p.status === 'sold_out' || p.status === 'paused' || p.status === 'deprecated'
            ? '<span class="badge">' + ({sold_out:'售罄',paused:'暂停',deprecated:'下架'}[p.status]||'—') + '</span>'
            : '<a href="' + (p.action || '#') + '" target="_blank" rel="nofollow sponsored" class="btn btn-primary btn-sm">去购买 →</a>';
          return '<td class="col-action">' + buyBtn + '</td>';
        }
        if (c.key === 'vendor') {
          return '<td class="col-vendor">' +
            '<div style="font-weight:600;">' + escapeHtml(p.vendor) + '</div>' +
            '<div style="font-size:12px;color:var(--text-helper);font-weight:400;">' + escapeHtml(p.plan) + ' · ' + escapeHtml(p.type) + '</div>' +
          '</td>';
        }
        if (c.isPrice) {
          const val = typeof p.monthlyPrice === 'number' ? formatPrice(p.monthlyPrice, p.currency || '¥') : '<span style="color:var(--text-placeholder);">—</span>';
          return '<td class="col-price">' + val + '</td>';
        }
        if (c.key === 'usage') {
          const val = p.tokenLimit || (p.measuredMonthlyToken ? p.measuredMonthlyToken + 'M Token' : '<span style="color:var(--text-placeholder);">按量</span>');
          return '<td style="font-size:12px;color:var(--text-secondary);">' + escapeHtml(val) + '</td>';
        }
        if (c.isTPU) {
          const tpu = (typeof p.monthlyPrice === 'number' && typeof p.measuredMonthlyToken === 'number' && p.monthlyPrice > 0)
            ? '<span style="font-family:var(--mono);font-weight:700;color:var(--accent);">' + (p.measuredMonthlyToken / p.monthlyPrice).toFixed(2) + '</span><span style="color:var(--text-helper);font-size:10px;"> M/元</span>'
            : '<span style="color:var(--text-placeholder);">—</span>';
          return '<td class="col-price">' + tpu + '</td>';
        }
        if (c.isRateLimit) {
          return '<td style="font-size:11px;color:var(--text-secondary);">' + escapeHtml(p.rateLimit || '—') + '</td>';
        }
        if (c.key === 'models') {
          const km = (p.models || []).slice(0, 3).join(' / ') + ((p.models || []).length > 3 ? ' +' + (p.models.length - 3) : '');
          return '<td style="font-size:12px;">' + escapeHtml(km) + '</td>';
        }
        // API 按量列
        if (c.key === 'inputPrice' || c.key === 'outputPrice' || c.key === 'cachePrice') {
          const v = p[c.key];
          const val = typeof v === 'number' ? '<span style="font-family:var(--mono);font-weight:600;">¥' + v + '</span>' : '<span style="color:var(--text-placeholder);">—</span>';
          return '<td class="col-price">' + val + '</td>';
        }
        if (c.key === 'contextLen') {
          return '<td style="font-size:12px;color:var(--text-secondary);">' + escapeHtml(p.contextLen || '—') + '</td>';
        }
        return '<td>—</td>';
      }).join('');
      return '<tr>' + cells + '</tr>';
    }).join('');
  }
  renderCompareCards(filtered);
}

// === 成本测算器 ===
function renderCalculator() {
  // 隐藏表格、筛选栏、散点图
  ['compareFilterBar', 'plansTableBody', 'plansCardsView'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
  const tableWrap = document.querySelector('.table-wrap');
  if (tableWrap) tableWrap.style.display = 'none';
  const chartCard = document.querySelector('.chart-card');
  if (chartCard) chartCard.style.display = 'none';
  const thead = document.getElementById('plansTableHead');
  if (thead) thead.innerHTML = '';

  const container = document.querySelector('#compare-body .container');
  if (!container) return;
  // 渲染测算器 UI（如果还没渲染）
  if (!document.getElementById('calcUI')) {
    container.insertAdjacentHTML('beforeend', renderCalcHTML());
    bindCalcControls();
  }
  document.getElementById('calcUI').style.display = 'block';
  // 渲染模型多选标签
  const modelFilter = document.getElementById('calcModelFilter');
  if (modelFilter && !modelFilter.dataset.rendered) {
    const allModels = [...new Set(plans.flatMap(p => p.models || []))].sort();
    modelFilter.innerHTML = allModels.map(m =>
      '<label style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--border-subtle);font-size:11px;cursor:pointer;color:var(--text-secondary);"><input type="checkbox" value="' + escapeHtml(m) + '" style="accent-color:var(--accent);">' + escapeHtml(m) + '</label>'
    ).join('');
    modelFilter.dataset.rendered = '1';
    modelFilter.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', updateCalcResults);
    });
  }
  updateCalcResults();
}

function bindCalcControls() {
  const profiles = [
    { inputM: 5, outputM: 2, cacheHitRate: 0.8 },
    { inputM: 30, outputM: 10, cacheHitRate: 0.7 },
    { inputM: 100, outputM: 40, cacheHitRate: 0.6 },
    { inputM: 300, outputM: 100, cacheHitRate: 0.5 },
  ];
  // 用户画像按钮：点了直接设用量并高亮
  document.querySelectorAll('.calc-profile').forEach((btn, i) => {
    if (i === 1) { btn.style.borderColor = 'var(--accent)'; btn.style.background = 'rgba(0,47,167,0.05)'; }
    btn.addEventListener('click', () => {
      const p = profiles[i];
      const inp = document.getElementById('calcInput');
      const out = document.getElementById('calcOutput');
      const cache = document.getElementById('calcCache');
      if (inp) { inp.value = p.inputM; document.getElementById('calcInputVal').textContent = p.inputM; }
      if (out) { out.value = p.outputM; document.getElementById('calcOutputVal').textContent = p.outputM; }
      if (cache) { cache.value = Math.round(p.cacheHitRate * 100); document.getElementById('calcCacheVal').textContent = Math.round(p.cacheHitRate * 100); }
      document.querySelectorAll('.calc-profile').forEach(b => { b.style.borderColor = 'var(--border-subtle)'; b.style.background = 'transparent'; });
      btn.style.borderColor = 'var(--accent)'; btn.style.background = 'rgba(0,47,167,0.05)';
      updateCalcResults();
    });
  });
  // 高级滑块
  const update = () => {
    const inp = document.getElementById('calcInput');
    const out = document.getElementById('calcOutput');
    const cache = document.getElementById('calcCache');
    if (inp) document.getElementById('calcInputVal').textContent = inp.value;
    if (out) document.getElementById('calcOutputVal').textContent = out.value;
    if (cache) document.getElementById('calcCacheVal').textContent = cache.value;
    updateCalcResults();
    document.querySelectorAll('.calc-profile').forEach(b => { b.style.borderColor = 'var(--border-subtle)'; b.style.background = 'transparent'; });
  };
  ['calcInput', 'calcOutput', 'calcCache'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', update);
  });
}

function updateCalcResults() {
  const inp = document.getElementById('calcInput');
  const out = document.getElementById('calcOutput');
  const cache = document.getElementById('calcCache');
  if (!inp || !out || !cache) return;
  const usage = {
    inputM: parseFloat(inp.value),
    outputM: parseFloat(out.value),
    cacheHitRate: parseFloat(cache.value) / 100,
  };
  // pricing-models 数据从注入的 DATA 读
  const models = (typeof DATA !== 'undefined' && DATA['pricing-models']) || (typeof pricingModels !== 'undefined' ? pricingModels : null);
  if (!models) return;
  let results = calcAll(models, usage, 'GLM-5.2');
  // 模型过滤：勾选了模型时，只保留支持选中模型的套餐
  const checkedModels = [...document.querySelectorAll('#calcModelFilter input:checked')].map(cb => cb.value);
  if (checkedModels.length) {
    // 找出支持选中模型的 vendorId 集合
    const supportedVendorIds = new Set(plans.filter(p => (p.models || []).some(m => checkedModels.includes(m))).map(p => p.vendorId));
    results = results.filter(r => supportedVendorIds.has(r.vendorId || r.vendorName));
    // 给每个结果标注支持的选中模型
    results.forEach(r => {
      const vendorPlans = plans.filter(p => (p.vendorId === r.vendorId || p.vendor === r.vendorName));
      const supModels = [...new Set(vendorPlans.flatMap(p => p.models || []))].filter(m => checkedModels.includes(m));
      if (supModels.length) r.note = (r.note || '') + ' · 支持: ' + supModels.join('/');
    });
  }
  const el = document.getElementById('calcResults');
  if (!el) return;
  el.innerHTML = '<div style="padding:var(--sp-4);">' +
    '<h3 style="margin:0 0 var(--sp-4);font-size:15px;font-weight:700;">成本排序（从低到高）</h3>' +
    results.map((r, i) => {
      const precIcon = r.precision === 'exact' ? '✅' : (r.precision === 'estimate' ? '⚠️' : '❓');
      const statusBadge = r.status === 'throttled' ? ' <span style="color:var(--text-helper);font-size:11px;">⚠️会限流</span>' : '';
      const costStr = r.cost !== null ? '¥' + r.cost + '/月' : '未公开';
      return '<div style="display:flex;align-items:center;padding:var(--sp-3);border-bottom:1px solid var(--border-subtle);">' +
        '<span style="font-family:var(--mono);font-weight:700;color:var(--text-helper);width:24px;">' + (i + 1) + '</span>' +
        '<div style="flex:1;"><div style="font-weight:600;font-size:13px;">' + escapeHtml(r.vendorName) + ' · ' + escapeHtml(r.planName) + statusBadge + '</div>' +
        '<div style="font-size:11px;color:var(--text-helper);">' + precIcon + ' ' + escapeHtml(r.note || '') + '</div></div>' +
        '<span style="font-family:var(--mono);font-weight:700;font-size:15px;color:' + (r.cost !== null ? 'var(--accent)' : 'var(--text-placeholder)') + ';">' + costStr + '</span>' +
      '</div>';
    }).join('') +
  '</div>';
}

function renderModelRows(filtered) {
  const tbody = document.getElementById('plansTableBody');
  if (!tbody) return;
  // 展平所有模型 → 支持的套餐
  const modelMap = {};
  filtered.forEach(p => {
    (p.models || []).forEach(m => {
      if (!modelMap[m]) modelMap[m] = [];
      modelMap[m].push(p);
    });
  });
  // 按支持平台数降序，再按模型名
  const models = Object.keys(modelMap).sort((a, b) => {
    const d = modelMap[b].length - modelMap[a].length;
    return d !== 0 ? d : a.localeCompare(b);
  });
  tbody.innerHTML = models.map(m => {
    const ps = modelMap[m];
    const platforms = [...new Set(ps.map(p => p.vendor))];
    // 最便宜月订阅（排除 sold_out/deprecated）
    const monthly = ps.filter(p => p.type !== 'API 按量' && typeof p.monthlyPrice === 'number' && p.status !== 'sold_out' && p.status !== 'deprecated');
    const cheapM = monthly.sort((a, b) => a.monthlyPrice - b.monthlyPrice)[0];
    // 最便宜 API（按输入价）
    const api = ps.filter(p => p.type === 'API 按量' && typeof p.inputPrice === 'number');
    const cheapA = api.sort((a, b) => a.inputPrice - b.inputPrice)[0];
    // 去购买按钮：优先最便宜月订阅，没有则 API
    const buyPlan = cheapM || cheapA;
    const buyBtn = buyPlan
      ? '<a href="' + (buyPlan.action || '#') + '" target="_blank" rel="nofollow sponsored" class="btn btn-primary btn-sm">去购买 -></a>'
      : '<span class="badge">-</span>';
    return '<tr class="model-row" data-model="' + escapeHtml(m) + '" style="cursor:pointer;">' +
      '<td class="col-vendor"><div style="font-weight:600;font-size:13px;">' + escapeHtml(m) + '</div></td>' +
      '<td><span class="badge">' + platforms.length + ' 家</span> <span style="font-size:11px;color:var(--text-helper);">' + escapeHtml(platforms.join(' / ')) + '</span></td>' +
      '<td class="col-price">' + (cheapM ? '<span style="font-family:var(--mono);font-weight:700;color:var(--accent);">¥' + cheapM.monthlyPrice + '</span><div style="font-size:11px;color:var(--text-helper);">' + escapeHtml(cheapM.vendor + ' ' + cheapM.plan) + '</div>' : '<span style="color:var(--text-placeholder);">-</span>') + '</td>' +
      '<td class="col-price">' + (cheapA ? '<span style="font-family:var(--mono);font-weight:700;color:var(--accent);">¥' + cheapA.inputPrice + '/¥' + cheapA.outputPrice + '</span><div style="font-size:11px;color:var(--text-helper);">输入/输出 per M · ' + escapeHtml(cheapA.vendor) + '</div>' : '<span style="color:var(--text-placeholder);">-</span>') + '</td>' +
      '<td class="col-action">' + buyBtn + '</td>' +
    '</tr>';
  }).join('');
  // 绑定点击事件：行内展开/收起比价图
  tbody.querySelectorAll('.model-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      const modelName = row.dataset.model;
      const next = row.nextElementSibling;
      const isOpen = next && next.classList && next.classList.contains('model-chart-row');
      // 先关闭所有已展开的
      tbody.querySelectorAll('.model-chart-row').forEach(r => r.remove());
      tbody.querySelectorAll('.model-row').forEach(r => { r.style.background = ''; });
      // 如果当前行没展开过，则展开（点已展开的行 = 收起）
      if (!isOpen) {
        row.style.background = 'var(--grey-1)';
        compareState.selectedModel = modelName;
        const chartRow = document.createElement('tr');
        chartRow.className = 'model-chart-row';
        chartRow.innerHTML = '<td colspan="5" style="padding:0;background:var(--grey-1);"><div id="inlineModelChart" style="width:100%;height:320px;"></div></td>';
        row.parentNode.insertBefore(chartRow, row.nextSibling);
        renderModelChart(modelName, 'inlineModelChart');
      }
    });
  });
  // 默认展开第一个多平台模型（行内就地展开）
  const firstMulti = models.find(m => modelMap[m].length >= 2) || models[0];
  if (firstMulti) {
    const firstRow = tbody.querySelector('.model-row[data-model="' + CSS.escape(firstMulti) + '"]');
    if (firstRow) firstRow.click();
  }
}

// 单个模型各平台 TOKEN/元 柱状图（行内就地渲染）
function renderModelChart(modelName, chartId) {
  const chartDom = document.getElementById(chartId || 'inlineModelChart');
  if (!chartDom || typeof echarts === 'undefined') return;
  const existing = echarts.getInstanceByDom(chartDom);
  if (existing) existing.dispose();

  // 收集该模型所有套餐
  const ps = plans.filter(p => p.status !== 'deprecated' && (p.models || []).includes(modelName));
  // 计算 TOKEN/元（M）：1元能买多少 M token
  // API 按量：1/输出价；月订阅：从 tokenLimit 解析总 token ÷ 月费，或用 measuredMonthlyToken
  const parseTokenM = (p) => {
    if (typeof p.measuredMonthlyToken === 'number' && p.measuredMonthlyToken > 0) return p.measuredMonthlyToken;
    if (!p.tokenLimit) return null;
    const t = p.tokenLimit;
    // 匹配 "3500万 Tokens/月" "1亿 Tokens/月" "6.5亿" 等
    const m = t.match(/([\d.]+)\s*([亿万])\s*Tokens?/i) || t.match(/([\d.]+)\s*([亿万])/);
    if (!m) return null;
    let n = parseFloat(m[1]);
    if (m[2] === '亿') n *= 100;
    else if (m[2] === '万') n /= 100; // 万 token = 0.01M
    return n; // 单位 M
  };
  const items = ps.map(p => {
    let tpu, type, isEstimate = false;
    if (p.type === 'API 按量' && typeof p.outputPrice === 'number' && p.outputPrice > 0) {
      tpu = 1 / p.outputPrice; // 1元买多少M输出
      type = 'API按量';
    } else if (typeof p.monthlyPrice === 'number' && p.monthlyPrice > 0) {
      const totalM = parseTokenM(p);
      if (!totalM) return null;
      tpu = totalM / p.monthlyPrice; // 整池总额度÷月费（估算，多模型共享）
      type = '月订阅';
      isEstimate = true;
    } else return null;
    return { name: p.vendor + ' ' + p.plan, tpu: Math.round(tpu * 100) / 100, type, isEstimate, action: p.action, status: p.status };
  }).filter(Boolean).sort((a, b) => b.tpu - a.tpu); // 高→低，越高越划算

  if (!items.length) { card.style.display = 'none'; return; }
  const C = { text: '#525252', grid: '#e0e0e0', monthly: '#002fa7', api: '#737373', tooltipBg: '#0a0a0a', tooltipText: '#fafaf8' };
  const chart = echarts.init(chartDom);
  window._modelChart = chart;
  chart.setOption({
    animationDuration: 400,
    grid: { left: 60, right: 30, top: 40, bottom: 90 },
    tooltip: { trigger: 'item', backgroundColor: C.tooltipBg, textStyle: { color: C.tooltipText, fontSize: 12 },
      formatter: p => { const d = items[p.dataIndex]; return '<b>' + d.name + '</b><div style="font-size:11px;color:#d4d4d2;margin-top:3px;">' + d.type + ' · <b>' + d.tpu + ' M/元</b>' + (d.isEstimate ? '（整池额度估算）' : '') + '</div><div style="font-size:11px;color:#d4d4d2;">1元 = ' + d.tpu + 'M token</div>'; } },
    legend: { data: ['月订阅', 'API按量'], bottom: 0, textStyle: { color: C.text, fontSize: 11 }, itemWidth: 10, itemHeight: 10 },
    xAxis: { type: 'category', data: items.map(i => i.name + (i.isEstimate ? ' *' : '')), axisLabel: { color: C.text, fontSize: 10, rotate: 35, interval: 0, width: 80, overflow: 'truncate' }, axisLine: { lineStyle: { color: C.grid } } },
    yAxis: { type: 'value', name: 'TOKEN/元 (M)', nameTextStyle: { color: C.text, fontSize: 11 }, axisLabel: { color: C.text, formatter: v => v + 'M' }, splitLine: { lineStyle: { color: C.grid, type: 'dashed' } } },
    series: [{
      type: 'bar', barWidth: '55%',
      itemStyle: { color: p => items[p.dataIndex].type === '月订阅' ? C.monthly : C.api },
      label: { show: true, position: 'top', color: C.text, fontSize: 11, fontWeight: 700, formatter: p => items[p.dataIndex].tpu + 'M' },
      data: items.map(i => i.tpu),
    }],
    graphic: [{ type: 'text', left: 0, top: 0, silent: true, z: 100, style: { text: '* 月订阅按整池额度÷月费估算（多模型共享，非单一模型精确值）· 越高越划算', fill: C.text, fontSize: 10 } }],
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderChart() {
  if (typeof echarts === 'undefined') return;
  const dom = document.getElementById('priceVsTokenChart');
  if (!dom || dom.offsetParent === null) return;

  if (existing) existing.dispose();

  const mode = compareState.columnMode;
  const isApi = mode === 'api';
  const isModel = mode === 'model';

  const subEl = document.getElementById('chartSubtitle');
  dom.style.height = '';
  if (titleEl) titleEl.textContent = isModel ? '模型覆盖度 vs 最便宜月订阅价' : (isApi ? '输入价 vs 输出价' : '月费 vs 月Token额度');
  if (subEl) subEl.textContent = isModel ? '越靠右下越优（覆盖广 + 便宜）' : (isApi ? '越靠左下越便宜（¥/百万token）' : '越靠左下越便宜（高性价比区）');

  if (isModel) {

    }).filter(Boolean);

      animationDuration: 400,
      grid: { left: 70, right: 100, top: 40, bottom: 50 },
      tooltip: { trigger: 'item', backgroundColor: C.tooltipBg, borderColor: C.tooltipBorder, textStyle: { color: C.tooltipText, fontSize: 13 },
        formatter: p => { const d = p.data; return '<b>' + d.model + '</b><div style="font-size:12px;color:#d4d4d2;margin-top:4px;">支持 ' + d.platformCount + ' 平台 · 最便宜 ¥' + d.price + '/月</div><div style="font-size:11px;color:#d4d4d2;">' + d.vendor + ' ' + d.plan + '</div>'; } },
      xAxis: { type: 'value', name: '支持平台数', nameTextStyle: { color: C.text, fontSize: 11 }, min: 0.5, max: 3.5, axisLabel: { color: C.text, formatter: v => v + ' 家' }, splitLine: { lineStyle: { color: C.grid, type: 'dashed' } } },
      yAxis: { type: 'log', name: '最便宜月订阅 (¥)', nameTextStyle: { color: C.text, fontSize: 11 }, min: minP * 0.5, max: maxP * 2, axisLabel: { color: C.text, formatter: v => '¥' + v }, splitLine: { lineStyle: { color: C.grid, type: 'dashed' } } },
      series: [{
        type: 'scatter', symbolSize: 16, color: C.accent,
        label: { show: true, position: 'right', distance: 8, color: C.text, fontSize: 10, fontWeight: 600, formatter: p => p.data.model, labelLayout: { hideOverlap: true } },
        itemStyle: { color: C.accent, borderColor: '#fff', borderWidth: 1.5 },
        data: items.map(i => ({ value: [i.platformCount, i.price], model: i.model, platformCount: i.platformCount, price: i.price, vendor: i.vendor, plan: i.plan })),
        emphasis: { scale: 1.2 },

      graphic: [

      ],
    });

  }

  if (isApi) {

        plan: p.plan, vendor: p.vendor, input: p.inputPrice, output: p.outputPrice, cache: p.cachePrice,
      }));
      return { name: v, type: 'scatter', color: vendorColor(v), symbolSize: 14,
        label: { show: true, position: 'right', distance: 6, color: C.text, fontSize: 10, fontWeight: 600, formatter: p => p.data.plan, labelLayout: { hideOverlap: true } },

    markArea: { silent: true, label: { show: false }, data: [
      [{ itemStyle: { color: C.cheap }, xAxis: minP * 0.7, yAxis: minT * 0.5 }, { xAxis: medP, yAxis: maxT * 1.2 }],
      [{ itemStyle: { color: C.expensive }, xAxis: medP, yAxis: minT * 0.5 }, { xAxis: maxP * 1.3, yAxis: medT }]
    ]},
    markLine: { silent: true, symbol: 'none', label: { show: false }, data: [
      { xAxis: medP, lineStyle: { color: 'rgba(115,115,115,0.25)', type: 'dashed' } },
      { yAxis: medT, lineStyle: { color: 'rgba(115,115,115,0.25)', type: 'dashed' } }

  chart.setOption({
    animationDuration: 400,
    grid: { left: 70, right: 40, top: 40, bottom: 50 },

    legend: { top: 0, left: 0, itemWidth: 10, itemHeight: 10, icon: 'circle', textStyle: { color: C.text, fontSize: 11, fontWeight: 600 } },
    graphic: [

      { type: 'text', right: 40, bottom: 20, silent: true, style: { text: '低性价比', fill: C.text, fontSize: 11, fontWeight: 700 } }
    ],
    xAxis: { type: 'log', logBase: 2, min: minP * 0.75, max: maxP * 1.12, name: '月费 (¥)', nameTextStyle: { color: C.text, fontSize: 11, fontWeight: 700 }, axisLabel: { color: C.text, fontSize: 11, fontWeight: 700, formatter: v => '¥' + (Number.isInteger(v) ? v : v.toFixed(0)) }, splitLine: { show: true, lineStyle: { color: C.grid, type: 'dashed' } } },
    yAxis: { type: 'log', logBase: 10, min: minT * 0.65, max: maxT * 1.18, name: '月Token额度', nameTextStyle: { color: C.text, fontSize: 11, fontWeight: 700 }, axisLabel: { color: C.text, formatter: v => v >= 1000 ? (v / 1000).toFixed(1) + 'B' : v + 'M' }, splitLine: { lineStyle: { color: C.grid, type: 'dashed' } } },
    series: [helper].concat(series)
  });
  window.addEventListener('resize', () => chart.resize());
}

// ============================================================
// 成本计算引擎 — 7家厂商 × 4种计费类型
// 输入: usage = { inputM, outputM, cacheHitRate }
//   inputM: 月输入token（百万）
//   outputM: 月输出token（百万）
//   cacheHitRate: 缓存命中率 (0-1)
// 输出: { cost, status, note, precision, planName, vendorName }
//   cost: 月成本（元），null=无法计算
//   status: 'ok' | 'throttled' | 'unknown' | 'error'
// ============================================================

// usage 默认值（中度场景）
const DEFAULT_USAGE = { inputM: 30, outputM: 10, cacheHitRate: 0.7 };

/**
 * 计算所有厂商的所有套餐成本，返回排序后的结果数组
 * @param {object} models - pricing-models.json 数据
 * @param {object} usage - { inputM, outputM, cacheHitRate }
 * @param {string} selectedModel - 用户选的参考模型（影响智谱等按模型计费的厂商）
 * @returns {Array} 排序后的结果（成本从低到高，null 排最后）
 */
function calcAll(models, usage, selectedModel) {
  const results = [];
  for (const [vendorId, vendor] of Object.entries(models)) {
    if (vendorId.startsWith('_')) continue;
    const vendorResults = calcVendor(vendorId, vendor, usage, selectedModel);
    results.push(...vendorResults);
  }
  // 排序：有成本的在前（低→高），null（未公开）在后
  results.sort((a, b) => {
    if (a.cost === null && b.cost === null) return 0;
    if (a.cost === null) return 1;
    if (b.cost === null) return -1;
    return a.cost - b.cost;
  });
  return results;
}

function calcVendor(vendorId, vendor, usage, selectedModel) {
  const results = [];
  switch (vendor.type) {
    case 'payg':
      // 按量：每个模型一个结果
      for (const [modelId, prices] of Object.entries(vendor.models)) {
        const r = calcPayg(vendor, modelId, prices, usage);
        results.push(r);
      }
      // 如果有会员（Kimi），也列出
      if (vendor.membership) {
        for (const [planName, plan] of Object.entries(vendor.membership.plans)) {
          results.push({
            vendorName: vendor.name, planName: planName + '（会员）',
            cost: plan.fee, status: 'unknown', precision: vendor.membership.precision,
            note: vendor.membership.note || '额度未公开',
          });
        }
      }
      break;

    case 'credit':
      // 积分制（智谱）：用选中模型的系数算积分消耗
      for (const [planName, plan] of Object.entries(vendor.plans)) {
        const r = calcCredit(vendor, planName, plan, usage, selectedModel);
        results.push(r);
      }
      break;

    case 'pool':
      // Token池（腾讯）：每个套餐一个结果
      for (const [planName, plan] of Object.entries(vendor.plans)) {
        const r = calcPool(vendor, planName, plan, usage);
        results.push(r);
      }
      break;

    case 'call-estimate':
      // 次数估算（MiniMax）
      for (const [planName, plan] of Object.entries(vendor.plans)) {
        const r = calcCallEstimate(vendor, planName, plan, usage);
        results.push(r);
      }
      break;

    case 'call-count':
      // 调用次数（阿里）
      for (const [planName, plan] of Object.entries(vendor.plans)) {
        const r = calcCallCount(vendor, planName, plan, usage);
        results.push(r);
      }
      break;

    case 'unknown':
      // 未公开（字节）：只给月费
      for (const [planName, plan] of Object.entries(vendor.plans)) {
        results.push({
          vendorName: vendor.name, planName,
          cost: plan.fee, status: 'unknown', precision: 'unknown',
          note: vendor.note || '计费规则未公开',
        });
      }
      break;
  }
  // 给每个结果补 vendorId（用于模型过滤关联）
  results.forEach(r => { r.vendorId = vendorId; });
  return results;
}

// === 按量计费（DeepSeek / Kimi K3 API）===
function calcPayg(vendor, modelId, prices, usage) {
  const cachedInput = usage.inputM * usage.cacheHitRate;
  const missInput = usage.inputM * (1 - usage.cacheHitRate);
  // 价格单位：元/百万token，usage 单位：百万 token，直接相乘
  const cost = cachedInput * prices.inputCached + missInput * prices.inputMiss + usage.outputM * prices.output;
  return {
    vendorName: vendor.name,
    planName: modelId + '（按量）',
    cost: Math.round(cost * 100) / 100,
    status: 'ok',
    precision: vendor.precision || 'exact',
    note: '按量付费，用多少付多少',
  };
}

// === 积分制（智谱）===
function calcCredit(vendor, planName, plan, usage, selectedModel) {
  // 找模型系数：优先用户选的，否则默认 GLM-5.2
  const modelName = selectedModel && vendor.models[selectedModel] ? selectedModel : 'GLM-5.2';
  const coef = vendor.models[modelName];
  if (!coef) {
    return { vendorName: vendor.name, planName, cost: null, status: 'error', precision: 'exact', note: '模型系数缺失' };
  }
  // 积分消耗 = (输入×In + 缓存×Cached + 输出×Out) / 10000，单位：百万token→×1e6/1e4=×100
  const cachedInputM = usage.inputM * usage.cacheHitRate;
  const pointsUsed = (usage.inputM * coef.input + cachedInputM * coef.cached + usage.outputM * coef.output) * 100;
  // 月积分 ≈ 周积分 × 4.33
  const monthlyPoints = plan.weeklyPoints * 4.33;
  if (pointsUsed <= monthlyPoints) {
    return {
      vendorName: vendor.name, planName: planName + '（' + modelName + '）',
      cost: plan.fee, status: 'ok', precision: 'exact',
      note: '消耗 ' + Math.round(pointsUsed) + ' 积分/月，额度 ' + Math.round(monthlyPoints) + '，够用',
    };
  } else {
    return {
      vendorName: vendor.name, planName: planName + '（' + modelName + '）',
      cost: plan.fee, status: 'throttled', precision: 'exact',
      note: '需 ' + Math.round(pointsUsed) + ' 积分/月，超出额度 ' + Math.round(monthlyPoints) + '，会限流',
    };
  }
}

// === Token池（腾讯）===
function calcPool(vendor, planName, plan, usage) {
  // 三类 token 1:1:1 统一抵扣（缓存命中+未命中+输出）
  const cachedInputM = usage.inputM * usage.cacheHitRate;
  const missInputM = usage.inputM * (1 - usage.cacheHitRate);
  const totalTokens = (cachedInputM + missInputM + usage.outputM) * 1e6; // 转 token 数
  if (totalTokens <= plan.tokens) {
    return {
      vendorName: vendor.name, planName,
      cost: plan.fee, status: 'ok', precision: 'exact',
      note: '消耗 ' + (totalTokens / 1e6).toFixed(0) + 'M Token，额度 ' + (plan.tokens / 1e6).toFixed(0) + 'M，够用',
    };
  } else {
    return {
      vendorName: vendor.name, planName,
      cost: plan.fee, status: 'throttled', precision: 'exact',
      note: '需 ' + (totalTokens / 1e6).toFixed(0) + 'M Token，超出额度 ' + (plan.tokens / 1e6).toFixed(0) + 'M，会限流',
    };
  }
}

// === 次数估算（MiniMax）===
function calcCallEstimate(vendor, planName, plan, usage) {
  // 总token / 单次token = 调用次数
  const totalTokens = (usage.inputM + usage.outputM) * 1e6;
  const estimatedCalls = totalTokens / vendor.tokensPerCall;
  if (estimatedCalls <= plan.callsPerMonth) {
    return {
      vendorName: vendor.name, planName,
      cost: plan.fee, status: 'ok', precision: 'estimate',
      note: '约 ' + Math.round(estimatedCalls) + ' 次调用，额度 ' + plan.callsPerMonth + ' 次（按M3 50K/次估算）',
    };
  } else {
    return {
      vendorName: vendor.name, planName,
      cost: plan.fee, status: 'throttled', precision: 'estimate',
      note: '约 ' + Math.round(estimatedCalls) + ' 次调用，超额度 ' + plan.callsPerMonth + ' 次（估算，可能需购积分包）',
    };
  }
}

// === 调用次数（阿里，按提问次数）===
function calcCallCount(vendor, planName, plan, usage) {
  // token → 提问次数：总token / (callsPerQuery × avgTokensPerCall)
  // 阿里按"模型调用次数"计，1次提问≈5-30次调用，取均值15
  // 假设每次调用约 5K token（编程场景平均）
  const totalTokens = (usage.inputM + usage.outputM) * 1e6;
  const estimatedCalls = totalTokens / 5000;
  if (estimatedCalls <= plan.callsPerMonth) {
    return {
      vendorName: vendor.name, planName,
      cost: plan.fee, status: 'ok', precision: 'estimate',
      note: '约 ' + Math.round(estimatedCalls) + ' 次调用，额度 ' + plan.callsPerMonth + ' 次（按5K/次估算）',
    };
  } else {
    return {
      vendorName: vendor.name, planName,
      cost: plan.fee, status: 'throttled', precision: 'estimate',
      note: '约 ' + Math.round(estimatedCalls) + ' 次调用，超额度 ' + plan.callsPerMonth + ' 次，会限流',
    };
  }
}
